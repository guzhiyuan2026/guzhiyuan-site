<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - 页面未找到 | 贵州古芝源品牌管理有限公司</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="canonical" href="https://www.gzguzhiyuan.com/">
    <meta name="description" content="您访问的页面不存在，请返回古芝源首页继续浏览。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe4c4 100%);
            color: #4a2511;
            text-align: center;
            padding: 2rem;
        }
        .card {
            max-width: 520px;
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: 0 12px 48px rgba(243, 148, 35, 0.18);
        }
        .code {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #F39423 0%, #c9540f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            color: #4a2511;
        }
        p {
            color: #6b4a3a;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        a.btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #F39423 0%, #d97510 100%);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(243, 148, 35, 0.35); }
        .btn-secondary {
            background: #fff;
            color: #c9540f;
            border: 1.5px solid #F39423;
        }
        .btn-secondary:hover { background: #fff5e6; }
        .brand {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #a37a5a;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>页面未找到</h1>
        <p>您访问的链接可能已失效，或页面已被移除。<br>请返回首页继续浏览古芝源品牌。</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">返回首页</a>
            <a href="/products.html" class="btn btn-secondary">浏览产品</a>
        </div>
        <div class="brand">贵州古芝源品牌管理有限公司 · 传承古法·芝养人生</div>
    </main>
</body>
</html>
