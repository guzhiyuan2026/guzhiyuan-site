    <link rel="stylesheet" href="styles.css">
    <style>
        .about-page {
            padding: 120px 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .about-section { margin-bottom: 5rem; }
        .about-section h2 {
            font-size: 2.5rem;
            color: var(--primary-green);
            margin-bottom: 2rem;
            text-align: center;
        }
        .about-section h2::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: var(--gold);
            margin: 1rem auto;
        }
        .about-text {
            font-size: 1.1rem;
            line-height: 2;
            color: var(--text-light);
            max-width: 900px;
            margin: 0 auto;
        }
        .about-text p { margin-bottom: 1.5rem; }
        .about-text h4 {
            color: var(--primary-green);
            font-size: 1.3rem;
            margin: 2rem 0 1rem;
        }
        .timeline {
            position: relative;
            padding: 2rem 0;
            max-width: 900px;
            margin: 0 auto;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: var(--primary-green);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
        }
        .timeline-item:nth-child(odd) { flex-direction: row; }
        .timeline-item:nth-child(even) { flex-direction: row-reverse; }
        .timeline-content {
            width: 45%;
            padding: 2rem;
            background: var(--cream);
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .timeline-year {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-green);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1;
        }
        .timeline-content h3 {
            color: var(--primary-green);
            margin-bottom: 1rem;
        }
        .timeline-content p {
            color: var(--text-light);
            line-height: 1.8;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .team-member {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .team-member:hover { transform: translateY(-5px); }
        .team-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }
        .team-member h3 {
            color: var(--primary-green);
            margin-bottom: 0.5rem;
        }
        .team-member .position {
            color: var(--earth-brown);
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .team-member p {
            color: var(--text-light);
            line-height: 1.8;
        }
        .certifications {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .cert-item {
            text-align: center;
            padding: 2rem;
            background: var(--cream);
            border-radius: 10px;
        }
        .cert-item .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
        .cert-item h3 {
            color: var(--primary-green);
            margin-bottom: 0.5rem;
        }
        .cert-item p {
            color: var(--text-light);
            font-size: 0.95rem;
        }
        .culture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }
        .culture-card {
            background: white;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            border-left: 4px solid var(--primary-green);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        .culture-card:nth-child(2) { border-left-color: var(--gold); }
        .culture-card:nth-child(3) { border-left-color: #2C5F2D; }
        .culture-card:nth-child(4) { border-left-color: var(--earth-brown); }
        .culture-card:nth-child(5) { border-left-color: #8B4513; }
        .culture-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 36px rgba(0,0,0,0.12);
        }
        .culture-card .culture-icon {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }
        .culture-card .culture-label {
            font-size: 0.85rem;
            color: var(--primary-green);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .culture-card .culture-subtitle {
            font-size: 1.25rem;
            color: var(--dark-green);
            font-weight: 700;
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }
        .culture-card .culture-desc {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.8;
            flex: 1;
        }
        @media (max-width: 768px) {
            .culture-grid {
                grid-template-columns: 1fr;
            }
            .culture-card { padding: 1.8rem 1.5rem; }
            .timeline::before { left: 20px; }
            .timeline-item {
                flex-direction: column !important;
                padding-left: 50px;
            }
            .timeline-content { width: 100%; }
            .timeline-year {
                left: 20px;
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">

                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">

                    <a href="special.html" onclick="event.preventDefault();event.stopPropagation();this.parentElement.toggleAttribute('data-open');">专题平台 ▾<span class="arrow">▼</span></a>

                    <a href="cart.html" class="cart-link">

                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 关于我们页面 -->
    <section class="about-page" id="about-content"></section>

    <!-- 页脚 -->
    <footer class="footer" id="footer"></footer>

    <script>
    (async function init() {
        try {
            const [aboutRes, siteRes] = await Promise.all([
                fetch('content/about.json'),
                fetch('content/site.json')
            ]);
            const about = await aboutRes.json();
            const site = await siteRes.json();
            const co = site.company || {};
            const ft = site.footer || {};

            // === Logo ===
            if (co.logoImage) {
                var li = document.getElementById('logo-img');
                if (li) { li.src = co.logoImage; li.style.display = ''; li.onerror = function() { li.style.display = 'none'; var lc2 = document.getElementById('logo-icon'); if (lc2) lc2.style.display = ''; }; }
                var lc = document.getElementById('logo-icon');
                if (lc) lc.style.display = 'none';
            }
            document.getElementById('logo-text').textContent = co.shortName || '古芝源';
            document.title = '关于我们 - ' + (co.name || '贵州古芝源品牌管理有限公司');

            // === 公司简介 ===
            const intro = about.intro || {};
            let introHtml = '<div class="about-section fade-in"><h2>' + (intro.title || '公司简介') + '</h2><div class="about-text">';
            (intro.paragraphs || []).forEach(function(p) {
                if (p.match(/^[^a-zA-Z0-9\s]{0,2}[\u4e00-\u9fa5]+[^a-zA-Z0-9\s]{0,2}$/)) {
                    // Short line looks like a subtitle
                    introHtml += '<h4>' + p + '</h4>';
                } else {
                    introHtml += '<p>' + p.replace(/\n/g, '</p><p>') + '</p>';
                }
            });
            introHtml += '</div></div>';

            // === 文化理念 ===
            const culture = about.culture || {};
            let cultureHtml = '';
            if (culture.items && culture.items.length > 0) {
                cultureHtml = '<div class="about-section fade-in"><h2>' + (culture.title || '文化理念') + '</h2><div class="culture-grid">';
                (culture.items || []).forEach(function(item) {
                    cultureHtml += '<div class="culture-card">';
                    if (item.icon) cultureHtml += '<div class="culture-icon">' + item.icon + '</div>';
                    cultureHtml += '<div class="culture-label">' + item.title + '</div>';
                    cultureHtml += '<div class="culture-subtitle">' + item.subtitle + '</div>';
                    cultureHtml += '<div class="culture-desc">' + item.description + '</div>';
                    cultureHtml += '</div>';
                });
                cultureHtml += '</div></div>';
            }

            // === 发展历程 ===
            const timeline = about.timeline || {};
            let timelineHtml = '<div class="about-section fade-in"><h2>' + (timeline.title || '发展历程') + '</h2><div class="timeline">';
            (timeline.items || []).forEach(function(item) {
                timelineHtml += '<div class="timeline-item"><div class="timeline-year">' + item.year + '</div>';
                timelineHtml += '<div class="timeline-content"><h3>' + item.title + '</h3><p>' + item.description + '</p></div></div>';
            });
            timelineHtml += '</div></div>';

            // === 核心团队 ===
            const team = about.team || {};
            let teamHtml = '<div class="about-section fade-in"><h2>' + (team.title || '核心团队') + '</h2><div class="team-grid">';
            (team.items || []).forEach(function(m) {
                teamHtml += '<div class="team-member"><div class="team-avatar">' + (m.icon || '👤') + '</div>';
                teamHtml += '<h3>' + m.name + '</h3><div class="position">' + m.position + '</div>';
                teamHtml += '<p>' + m.description + '</p></div>';
            });
            teamHtml += '</div></div>';

            // === 资质认证 ===
            const cert = about.certifications || {};
            let certHtml = '<div class="about-section fade-in"><h2>' + (cert.title || '资质认证') + '</h2><div class="certifications">';
            (cert.items || []).forEach(function(c) {
                certHtml += '<div class="cert-item"><span class="icon">' + (c.icon || '🏅') + '</span>';
                certHtml += '<h3>' + c.name + '</h3><p>' + c.description + '</p></div>';
            });
            certHtml += '</div></div>';

            document.getElementById('about-content').innerHTML = introHtml + cultureHtml + timelineHtml + teamHtml + certHtml;

            // === 页脚 ===
            document.getElementById('footer').innerHTML =
                '<p>' + (ft.copyright || '© 2026 贵州古芝源品牌管理有限公司 版权所有') + '</p>' +
                '<p>' + (ft.slogan || '传承古法 · 芝养人生') + '</p>';

            // === 动画初始化 ===
            const fadeIns = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            fadeIns.forEach(function(el) { observer.observe(el); });

        } catch (e) {
            console.error('Failed to load about page:', e);
        }
        updateCartBadge();
    })();
    </script>
    <script src="cart.js?v=20260624"></script>
    <script src="nav.js"></script>
</body>
