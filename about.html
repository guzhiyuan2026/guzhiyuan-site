<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们 - 古芝源</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .about-page { padding: 120px 2rem 5rem; max-width: 1200px; margin: 0 auto; }
        .about-section { margin-bottom: 5rem; }
        .about-section h2 { font-size: 2.5rem; color: var(--primary-green); margin-bottom: 2rem; text-align: center; }
        .about-section h2::after { content: ''; display: block; width: 80px; height: 3px; background: var(--gold); margin: 1rem auto; }
        .about-text { font-size: 1.1rem; line-height: 2; color: var(--text-light); max-width: 900px; margin: 0 auto; }
        .about-text p { margin-bottom: 1.5rem; }
        .timeline { position: relative; padding: 2rem 0; max-width: 900px; margin: 0 auto; }
        .timeline::before { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 3px; height: 100%; background: var(--primary-green); }
        .timeline-item { position: relative; margin-bottom: 3rem; display: flex; align-items: center; }
        .timeline-item:nth-child(odd) { flex-direction: row; }
        .timeline-item:nth-child(even) { flex-direction: row-reverse; }
        .timeline-content { width: 45%; padding: 2rem; background: var(--cream); border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .timeline-year {
            position: absolute; left: 50%; transform: translateX(-50%);
            background: var(--primary-green); color: white;
            padding: 0.5rem 1.5rem; border-radius: 20px; font-weight: bold; z-index: 1;
        }
        .timeline-content h3 { color: var(--primary-green); margin-bottom: 1rem; }
        .timeline-content p { color: var(--text-light); line-height: 1.8; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-top: 3rem; }
        .team-member { text-align: center; padding: 2rem; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .team-member:hover { transform: translateY(-5px); }
        .team-avatar { width: 120px; height: 120px; background: linear-gradient(135deg, var(--primary-green), var(--light-green)); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: white; }
        .team-member h3 { color: var(--primary-green); margin-bottom: 0.5rem; }
        .team-member .position { color: var(--earth-brown); font-weight: bold; margin-bottom: 1rem; }
        .team-member p { color: var(--text-light); line-height: 1.8; }
        .certifications { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; margin-top: 3rem; }
        .cert-item { text-align: center; padding: 2rem; background: var(--cream); border-radius: 10px; }
        .cert-item .icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
        .cert-item h3 { color: var(--primary-green); margin-bottom: 0.5rem; }
        .cert-item p { color: var(--text-light); font-size: 0.95rem; }
        @media (max-width: 768px) {
            .timeline::before { left: 20px; }
            .timeline-item { flex-direction: column !important; padding-left: 50px; }
            .timeline-content { width: 100%; }
            .timeline-year { left: 20px; transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">芝</span>
                古芝源
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html" style="color: var(--gold);">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>

    <section class="about-page">
        <!-- 公司简介 -->
        <div class="about-section fade-in" id="intro-section"></div>

        <!-- 发展历程 -->
        <div class="about-section fade-in" id="timeline-section"></div>

        <!-- 核心团队 -->
        <div class="about-section fade-in" id="team-section"></div>

        <!-- 资质认证 -->
        <div class="about-section fade-in" id="cert-section"></div>
    </section>

    <footer class="footer">
        <p>© 2026 贵州古芝源品牌管理有限公司 版权所有</p>
        <p>传承古法 · 芝养人生</p>
    </footer>

    <script>
        async function init() {
            try {
                const resp = await fetch('content/about.json');
                const data = await resp.json();

                // 公司简介
                const intro = document.getElementById('intro-section');
                intro.innerHTML = '<h2>' + data.intro.title + '</h2>' +
                    '<div class="about-text">' + data.intro.paragraphs.map(p => '<p>' + p + '</p>').join('') + '</div>';

                // 发展历程
                const timeline = document.getElementById('timeline-section');
                timeline.innerHTML = '<h2>' + data.timeline.title + '</h2>' +
                    '<div class="timeline">' + data.timeline.items.map(t =>
                        '<div class="timeline-item">' +
                        '<div class="timeline-year">' + t.year + '</div>' +
                        '<div class="timeline-content">' +
                        '<h3>' + t.title + '</h3>' +
                        '<p>' + t.description + '</p>' +
                        '</div></div>'
                    ).join('') + '</div>';

                // 核心团队
                const team = document.getElementById('team-section');
                team.innerHTML = '<h2>' + data.team.title + '</h2>' +
                    '<div class="team-grid">' + data.team.items.map(m =>
                        '<div class="team-member">' +
                        '<div class="team-avatar">' + m.icon + '</div>' +
                        '<h3>' + m.name + '</h3>' +
                        '<div class="position">' + m.position + '</div>' +
                        '<p>' + m.description + '</p>' +
                        '</div>'
                    ).join('') + '</div>';

                // 资质认证
                const cert = document.getElementById('cert-section');
                cert.innerHTML = '<h2>' + data.certifications.title + '</h2>' +
                    '<div class="certifications">' + data.certifications.items.map(c =>
                        '<div class="cert-item">' +
                        '<span class="icon">' + c.icon + '</span>' +
                        '<h3>' + c.name + '</h3>' +
                        '<p>' + c.description + '</p>' +
                        '</div>'
                    ).join('') + '</div>';

                initAnimations();
            } catch (err) {
                console.error('加载关于我们数据失败:', err);
            }
        }

        function initAnimations() {
            const els = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            els.forEach(el => observer.observe(el));
        }

        init();
    </script>
</body>
</html>
