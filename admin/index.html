<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>内容管理 - 古芝源后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0ede5; color: #333; }

        /* Login */
        .login-box {
            max-width: 420px; margin: 80px auto; padding: 36px 28px;
            background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            text-align: center;
        }
        .login-box h2 { color: #2d5016; margin-bottom: 8px; }
        .login-box .sub { color: #999; font-size: 13px; margin-bottom: 22px; }
        .login-box input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid #d5cdb8; border-radius: 6px;
            font-size: 14px; margin-bottom: 10px;
        }
        .login-box button {
            width: 100%; padding: 12px; background: #2d5016; color: #fff;
            border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
        }
        .login-box button:hover { background: #3a6a1e; }
        .login-box .note { font-size: 11px; color: #aaa; margin-top: 12px; line-height: 1.6; }
        .login-box .error { color: #c0392b; font-size: 13px; margin-top: 8px; }

            background: #2d5016; color: #fff; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .topbar h1 { font-size: 18px; }
        .topbar button { background: rgba(255,255,255,0.2); color:#fff; border:none; padding:6px 16px; border-radius:4px; cursor:pointer; }
        .main { display: flex; min-height: calc(100vh - 48px); }
        .sidebar {
            width: 220px; background: #fff; border-right: 1px solid #e5dfcf;
            padding: 12px 0; flex-shrink: 0;
        }
        .sidebar a {
            display: block; padding: 10px 24px; color: #555; text-decoration: none;
            font-size: 14px; border-left: 3px solid transparent;
        }
        .sidebar a:hover, .sidebar a.active { color: #2d5016; background: #f5f0e2; border-left-color: #2d5016; }
        .content { flex: 1; padding: 24px 32px; overflow-y: auto; }
        .section-title { color: #2d5016; font-size: 20px; margin-bottom: 18px; border-bottom: 2px solid #e5dfcf; padding-bottom: 8px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 8px 12px; border: 1px solid #d5cdb8; border-radius: 5px;
            font-size: 13px; font-family: inherit;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .btn-save {
            background: #2d5016; color: #fff; border: none; padding: 10px 28px;
            border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 8px;
        }
        .btn-save:hover { background: #3a6a1e; }
        .status { font-size: 13px; margin-left: 14px; }
        .status.success { color: #27ae60; }
        .status.error { color: #c0392b; }
        .status.info { color: #3498db; }

        .list-item {
            background: #fff; border: 1px solid #e5dfcf; border-radius: 6px;
            padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between;

        }

        .list-item .delete-btn { color: #c0392b; font-size: 13px; cursor: pointer; margin-left:12px; }

<body>

<!-- LOGIN -->
<div class="login-box" id="login-box">
    <h2>🌿 古芝源后台管理</h2>
    <p class="sub">www.gzguzhiyuan.com</p>

</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="admin-panel">

    </div>

        <div class="sidebar" id="sidebar">

            <a href="#" data-page="home">🏠 首页内容</a>
            <a href="#" data-page="about">📖 关于我们</a>
            <a href="#" data-page="contact">📞 联系我们</a>

<script>
const OWNER = 'guzhiyuan2026';
const REPO = 'guzhiyuan-site';
let TOKEN = '';

function login() {
    TOKEN = document.getElementById('token-input').value.trim();
    if (!TOKEN) { showError('请输入 Token'); return; }
    showError('');
    fetch('https://api.github.com/repos/' + OWNER + '/' + REPO, {
        headers: { Authorization: 'token ' + TOKEN }
    }).then(r => {
        if (r.ok) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadPage('site');
        } else {
            showError('Token 无效或无 repo 权限');
        }
    }).catch(() => showError('网络错误，GitHub API 不可达'));
}

function logout() {
    TOKEN = '';
    document.getElementById('login-box').style.display = 'block';
    document.getElementById('admin-panel').style.display = 'none';
}

function showError(msg) {
    document.getElementById('login-error').textContent = msg;
}

// ---- Sidebar ----
document.getElementById('sidebar').addEventListener('click', function(e) {
    if (e.target.tagName === 'A') {
        e.preventDefault();
        document.querySelectorAll('#sidebar a').forEach(a => a.classList.remove('active'));
        e.target.classList.add('active');
        loadPage(e.target.dataset.page);
    }
});

// ---- Load Pages ----
async function loadPage(page) {
    const area = document.getElementById('content-area');
    area.innerHTML = '<p style="color:#999;text-align:center;padding:40px;">加载中...</p>';
    switch(page) {
        case 'site': await loadSiteSettings(); break;
        case 'home': await loadHomeContent(); break;
        case 'about': await loadAboutContent(); break;
        case 'contact': await loadContactContent(); break;
        case 'news': await loadNewsList(); break;
        case 'products': await loadProductsList(); break;
    }
}

// ---- GitHub API helpers ----
function fromBase64(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder('utf-8').decode(bytes);
}

async function getFile(path) {
    const resp = await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path, {
        headers: { Authorization: 'token ' + TOKEN }
    });
    if (!resp.ok) throw new Error('Failed to load ' + path);
    const data = await resp.json();
    const jsonStr = fromBase64(data.content);
    return { content: JSON.parse(jsonStr), sha: data.sha };
}

function toBase64(str) {
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary);
}

async function saveFile(path, content, sha, message) {
    const body = JSON.stringify({
        message: message || 'Update ' + path,
        content: toBase64(JSON.stringify(content, null, 2)),
        branch: 'main',
        sha: sha
    });
    const resp = await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path, {
        method: 'PUT',
        headers: { Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json' },
        body: body
    });
    if (!resp.ok) throw new Error('Save failed');
    return resp.json();
}

// 上传二进制文件（图片等）
async function uploadBinaryFile(path, binaryContent, message) {
    const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(binaryContent)));
    let sha = null;
    try {
        const checkResp = await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path, {
            headers: { Authorization: 'token ' + TOKEN }
        });
        if (checkResp.ok) {
            const existing = await checkResp.json();
            sha = existing.sha;
        }
    } catch(e) {}
    const bodyObj = sha
        ? { message: message || 'Update ' + path, content: base64, branch: 'main', sha: sha }
        : { message: message || 'Upload ' + path, content: base64, branch: 'main' };
    const resp = await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path, {
        method: 'PUT',
        headers: { Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyObj)
    });
    if (!resp.ok) throw new Error('Upload failed: ' + resp.status);
    return resp.json();
}

async function createFile(path, content, message) {
    const body = JSON.stringify({
        message: message || 'Create ' + path,
        content: toBase64(JSON.stringify(content, null, 2)),
        branch: 'main'
    });
    const resp = await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path, {
        method: 'PUT',
        headers: { Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json' },
        body: body
    });
    if (!resp.ok) throw new Error('Create failed');
    return resp.json();
}

async function deleteFile(path, sha, message) {
    const body = JSON.stringify({ message: message || 'Delete ' + path, branch: 'main', sha: sha });
    const resp = await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path, {
        method: 'DELETE',
        headers: { Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json' },
        body: body
    });
    if (!resp.ok) throw new Error('Delete failed');
}

// ---- Form builder ----
function buildForm(fields, data, section) {
    let html = '';
    let fieldIdx = 0;
    for (const field of fields) {
        const key = field.name || fieldIdx++;
        const val = data ? (data[key] !== undefined ? data[key] : field.default || '') : (field.default || '');
        if (field.type === 'list') {
            html += '<div class="form-group"><label>' + field.label + '</label>';
            const items = Array.isArray(val) ? val : [];
            const subFields = field.children || [{ name: 'value', label: '值', type: 'text' }];
            html += '<div id="list-' + key.replace(/[^a-zA-Z0-9]/g,'_') + '">';
            items.forEach((item, i) => {
                let itemHtml = '';
                for (const sf of subFields) {
                    const sv = typeof item === 'object' ? (item[sf.name] || '') : item;
                    itemHtml += '<input type="text" value="' + esc(typeof item === 'object' ? (item[sf.name] || '') : item) + '" data-list="' + key.replace(/[^a-zA-Z0-9]/g,'_') + '" data-idx="' + i + '" data-field="' + sf.name + '" placeholder="' + sf.label + '" style="width:calc(100% - 40px);margin-bottom:4px;"> ';
                }
                html += '<div>' + itemHtml + '<button onclick="removeListItem(this)" style="color:#c0392b;border:none;background:none;cursor:pointer;font-size:18px;">&times;</button></div>';
            });
            html += '</div>';
            html += '<button onclick="addListItem(\'' + key.replace(/[^a-zA-Z0-9]/g,'_') + '\',\'' + section + '\',\'' + JSON.stringify(subFields).replace(/'/g,'%27') + '\')" style="color:#2d5016;border:1px dashed #2d5016;background:none;padding:4px 12px;border-radius:4px;cursor:pointer;margin-top:4px;">+ 添加</button>';
            html += '</div>';
        } else if (field.widget === 'select' || field.options) {
            html += '<div class="form-group"><label>' + field.label + '</label>';
            html += '<select data-field="' + key + '" data-section="' + section + '">';
            for (const opt of (field.options || [])) {
                html += '<option' + (val === opt ? ' selected' : '') + '>' + opt + '</option>';
            }
            html += '</select></div>';
        } else if (field.widget === 'textarea' || field.widget === 'text') {
            html += '<div class="form-group"><label>' + field.label + '</label>';
            html += '<textarea data-field="' + key + '" data-section="' + section + '" rows="4">' + esc(val) + '</textarea></div>';
        } else {
            html += '<div class="form-group"><label>' + field.label + '</label>';
            html += '<input type="text" data-field="' + key + '" data-section="' + section + '" value="' + esc(val) + '"></div>';
        }
    }
    return html;
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function collectForm(section) {
    const data = {};
    document.querySelectorAll('[data-section="'+section+'"]').forEach(el => {
        const key = el.dataset.field;
        if (!key) return;
        data[key] = el.value;
    });
    return data;
}

            + '<span class="status" id="logo-upload-status"></span>'

            + '</div>'
            + '<h3 style="margin-top:16px;color:#2d5016;">联系方式</h3>'
            + '<div class="form-group"><label>公司地址</label><input type="text" data-section="site" data-field="address" value="' + esc(c.address) + '"></div>'
            + '<div class="form-group"><label>电话</label><input type="text" data-section="site" data-field="phone" value="' + esc(c.phone) + '"></div>'
            + '<div class="form-group"><label>邮箱</label><input type="text" data-section="site" data-field="email" value="' + esc(c.emailBusiness || '') + '"></div>'
            + '<h3 style="margin-top:16px;color:#2d5016;">页脚</h3>'
            + '<div class="form-group"><label>版权信息</label><input type="text" data-section="site" data-field="copyright" value="' + esc(ft.copyright) + '"></div>'
            + '<div class="form-group"><label>页脚口号</label><input type="text" data-section="site" data-field="footerSlogan" value="' + esc(ft.slogan || '') + '"></div>'
            + '<button class="btn-save" onclick="saveSite()">保存站点设置</button><span class="status" id="site-status"></span>';
        document.getElementById('content-area').innerHTML = html;
    } catch(e) {
        document.getElementById('content-area').innerHTML = '<p style="color:#c0392b;">加载失败: ' + e.message + '</p>';
    }
}

async function saveSite() {
    const status = document.getElementById('site-status');
    status.textContent = '保存中...'; status.className = 'status info';
    try {
        const f = await getFile('content/site.json');
        siteSha = f.sha;
        const fields = document.querySelectorAll('[data-section="site"]');
        const data = {};
        fields.forEach(el => { data[el.dataset.field] = el.value; });
        f.content.company.name = data.companyName;
        f.content.company.shortName = data.shortName;
        f.content.company.slogan = data.slogan;
        f.content.company.logoIcon = data.logoIcon;
        // 保持 logoImage 现有值（由上传功能独立更新）
        await saveFile('content/site.json', f.content, siteSha, 'Update site settings');
        f.content.contact.address = data.address;
        f.content.contact.phone = data.phone;
        if (!f.content.contact.emailBusiness) f.content.contact.emailBusiness = data.email;
        else f.content.contact.emailBusiness = data.email;
        f.content.footer.copyright = data.copyright;
        f.content.footer.slogan = data.footerSlogan;
        await saveFile('content/site.json', f.content, siteSha, 'Update site settings');
        status.textContent = '✅ 已保存'; status.className = 'status success';
    } catch(e) {
        status.textContent = '❌ ' + e.message; status.className = 'status error';
    }
}

// ---- Logo Image Upload ----
async function uploadLogoImage() {
    const fileInput = document.getElementById('logo-file-input');
    const status = document.getElementById('logo-upload-status');
    if (!fileInput.files || !fileInput.files[0]) {
        status.textContent = '⚠️ 请先选择图片文件'; status.className = 'status error';
        return;
    }
    const file = fileInput.files[0];
    if (file.size > 2 * 1024 * 1024) {
        status.textContent = '⚠️ 图片不能超过2MB'; status.className = 'status error';
        return;
    }
    status.textContent = '上传中...'; status.className = 'status info';
    try {
        const buffer = await file.arrayBuffer();
        const ext = file.name.split('.').pop().toLowerCase();
        const imagePath = 'images/logo.' + ext;
        await uploadBinaryFile(imagePath, buffer, 'Upload company logo');
        // 更新 site.json
        const f = await getFile('content/site.json');
        f.content.company.logoImage = '/' + imagePath;
        await saveFile('content/site.json', f.content, f.sha, 'Update logo image path');
        siteSha = null;
        status.textContent = '✅ 上传成功！'; status.className = 'status success';
        setTimeout(() => loadSiteSettings(), 800);
    } catch(e) {
        status.textContent = '❌ ' + e.message; status.className = 'status error';
    }
}

async function saveHome() {
    const status = document.getElementById('home-status');

async function deleteNews(idx) {
