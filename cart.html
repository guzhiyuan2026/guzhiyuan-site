<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 贵州古芝源品牌管理有限公司</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cart-page {
            padding: 120px 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cart-title {
            color: var(--primary-green);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .cart-empty {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .cart-empty-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .cart-empty h3 {
            color: var(--text-light);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .cart-empty p {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .cart-empty .btn-continue {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .cart-empty .btn-continue:hover {
            background: var(--light-green);
        }

        .cart-items {
            margin-bottom: 2rem;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 80px 1fr auto auto auto;
            gap: 2rem;
            align-items: center;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            margin-bottom: 1rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .cart-item-icon {
            font-size: 3rem;
            text-align: center;
        }

        .cart-item-info h4 {
            color: var(--primary-green);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .cart-item-info .spec {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .cart-item-price {
            color: var(--earth-brown);
            font-size: 1.2rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-quantity-btn {
            width: 32px;
            height: 32px;
            border: 2px solid var(--primary-green);
            background: white;
            color: var(--primary-green);
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .cart-quantity-btn:hover {
            background: var(--primary-green);
            color: white;
        }

        .cart-quantity-input {
            width: 50px;
            height: 32px;
            border: 2px solid var(--cream);
            border-radius: 5px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: color 0.3s;
        }

        .cart-item-remove:hover {
            color: #d32f2f;
        }

        .cart-summary {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--cream);
        }

        .cart-total-label {
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        .cart-total-price {
            font-size: 2rem;
            color: var(--earth-brown);
            font-weight: bold;
        }

        .cart-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn-continue-shopping {
            padding: 1rem 2rem;
            background: white;
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            border-radius: 5px;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-continue-shopping:hover {
            background: var(--primary-green);
            color: white;
        }

        .btn-checkout {
            padding: 1rem 2rem;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-checkout:hover {
            background: var(--light-green);
        }

        .checkout-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .checkout-modal.show {
            display: flex;
        }

        .checkout-form {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .checkout-form h3 {
            color: var(--primary-green);
            font-size: 1.8rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--text-dark);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--cream);
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .checkout-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-cancel {
            flex: 1;
            padding: 1rem;
            background: white;
            color: var(--text-light);
            border: 2px solid var(--cream);
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: var(--cream);
        }

        .btn-submit-order {
            flex: 1;
            padding: 1rem;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit-order:hover {
            background: var(--light-green);
        }

        @media (max-width: 768px) {
            .cart-item {
                grid-template-columns: 60px 1fr;
                gap: 1rem;
            }

            .cart-item-price {
                grid-column: 2;
            }

            .cart-item-quantity {
                grid-column: 2;
            }

            .cart-item-remove {
                position: absolute;
                top: 1rem;
                right: 1rem;
            }

            .cart-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">芝</span>
                古芝源
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li class="dropdown">
                    <a href="special.html">专题平台 ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="zhong-houlu.html">钟氏中医药第十八代传人钟厚禄传记</a></li>
                    </ul>
                </li>
                <li><a href="contact.html">联系方式</a></li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" id="cart-badge">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 购物车页面 -->
    <section class="cart-page">
        <h2 class="cart-title fade-in">购物车</h2>

        <!-- 购物车为空 -->
        <div id="cart-empty" class="cart-empty fade-in">
            <div class="cart-empty-icon">🛒</div>
            <h3>购物车是空的</h3>
            <p>快去挑选您喜欢的商品吧！</p>
            <a href="products.html" class="btn-continue">去逛逛</a>
        </div>

        <!-- 购物车商品列表 -->
        <div id="cart-items" class="cart-items fade-in" style="display: none;"></div>

        <!-- 购物车汇总 -->
        <div id="cart-summary" class="cart-summary fade-in" style="display: none;">
            <div class="cart-total">
                <span class="cart-total-label">合计：</span>
                <span class="cart-total-price" id="cart-total-price">¥ 0.00</span>
            </div>
            <div class="cart-actions">
                <a href="products.html" class="btn-continue-shopping">
                    <span>←</span> 继续购物
                </a>
                <button class="btn-checkout" onclick="showCheckoutModal()">
                    提交订单 <span>→</span>
                </button>
            </div>
        </div>
    </section>

    <!-- 结算弹窗 -->
    <div id="checkout-modal" class="checkout-modal">
        <div class="checkout-form">
            <h3>提交订单</h3>
                <form id="checkout-form" onsubmit="submitOrder(event)">
                    <div class="form-group">
                        <label for="customer-name">姓名 *</label>
                        <input type="text" id="customer-name" placeholder="请输入您的姓名">
                    </div>
                    <div class="form-group">
                        <label for="customer-phone">电话 *</label>
                        <input type="tel" id="customer-phone" placeholder="请输入您的联系电话">
                </div>
                <div class="form-group">
                    <label for="customer-address">地址</label>
                    <input type="text" id="customer-address" placeholder="请输入收货地址（可选）">
                </div>
                <div class="form-group">
                    <label for="customer-remark">备注</label>
                    <textarea id="customer-remark" placeholder="请输入备注信息（可选）"></textarea>
                </div>
                <div class="checkout-buttons">
                    <button type="button" class="btn-cancel" onclick="closeCheckoutModal()">取消</button>
                    <button type="submit" class="btn-submit-order">提交订单</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer" id="footer">
        <p>© 2026 贵州古芝源品牌管理有限公司 版权所有</p>
        <p>传承古法 · 芝养人生</p>
    </footer>

    <script src="cart.js"></script>
    <script>
        // 加载购物车
        function loadCart() {
            var cartEmpty = document.getElementById('cart-empty');
            var cartItems = document.getElementById('cart-items');
            var cartSummary = document.getElementById('cart-summary');

            if (!cartEmpty || !cartItems || !cartSummary) return;

            var cart;
            try { cart = getCart(); } catch(e) { cart = []; }
            if (!Array.isArray(cart)) cart = [];

            if (cart.length === 0) {
                cartEmpty.style.display = '';
                cartItems.style.display = 'none';
                cartSummary.style.display = 'none';
                return;
            }

            // 显示购物车内容
            cartEmpty.style.display = 'none';
            cartItems.style.display = '';
            cartSummary.style.display = '';

            // 渲染购物车商品
            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item" data-id="${item.id}">
                    <div class="cart-item-icon">${item.icon}</div>
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <div class="spec">${item.spec || ''}</div>
                    </div>
                    <div class="cart-item-price">${item.price}</div>
                    <div class="cart-item-quantity">
                        <button class="cart-quantity-btn" onclick="updateQuantity('${item.id}', -1)">-</button>
                        <input type="number" class="cart-quantity-input" value="${item.quantity}" min="1" max="99" onchange="setQuantity('${item.id}', this.value)">
                        <button class="cart-quantity-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
                    </div>
                    <button class="cart-item-remove" onclick="removeItem('${item.id}')" title="移除">×</button>
                </div>
            `).join('');

            // 更新总价
            updateTotalPrice();
        }

        // 更新数量
        function updateQuantity(productId, delta) {
            var cart;
            try { cart = getCart(); } catch(e) { return; }
            if (!Array.isArray(cart)) return;
            const item = cart.find(i => i.id === productId);
            if (item) {
                const newQty = item.quantity + delta;
                if (newQty < 1) {
                    removeItem(productId);
                    return;
                }
                updateCartItemQuantity(productId, newQty);
                loadCart();
            }
        }

        // 设置数量
        function setQuantity(productId, value) {
            let qty = parseInt(value) || 1;
            if (qty < 1) qty = 1;
            if (qty > 99) qty = 99;
            updateCartItemQuantity(productId, qty);
            loadCart();
        }

        // 移除商品（使用美观确认弹窗）
        function removeItem(productId) {
            if (typeof showConfirm !== 'function') {
                if (typeof removeFromCart === 'function') removeFromCart(productId);
                loadCart();
                if (typeof updateCartBadge === 'function') updateCartBadge();
                return;
            }
            showConfirm('移除商品', '确定要从购物车中移除此商品吗？', function() {
                removeFromCart(productId);
                loadCart();
                updateCartBadge();
            });
        }

        // 更新总价
        function updateTotalPrice() {
            var total;
            try { total = getCartTotal(); } catch(e) { total = 0; }
            document.getElementById('cart-total-price').textContent = '¥ ' + total.toFixed(2);
        }

        // 显示结算弹窗
        function showCheckoutModal() {
            var modal = document.getElementById('checkout-modal');
            if (!modal) return;

            var cart;
            try { cart = getCart(); } catch(e) { cart = []; }
            if (!Array.isArray(cart) || cart.length === 0) {
                showModal({
                    icon: '🛒',
                    title: '购物车为空',
                    message: '请先添加商品到购物车后再提交订单。',
                    buttons: [{ text: '去逛逛', type: 'primary', onClick: function(close) { window.location.href = 'products.html'; } }]
                });
                return;
            }
            document.getElementById('checkout-modal').classList.add('show');
        }

        // 关闭结算弹窗
        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.remove('show');
        }

        // 提交订单
        function submitOrder(event) {
            event.preventDefault();

            var name = document.getElementById('customer-name').value.trim();
            var phone = document.getElementById('customer-phone').value.trim();
            var address = document.getElementById('customer-address').value.trim();
            var remark = document.getElementById('customer-remark').value.trim();

            // 姓名校验
            if (!name) {
                showModal({
                    icon: '📝',
                    title: '请填写信息',
                    message: '请输入您的姓名。',
                    buttons: [{ text: '好的', type: 'primary', onClick: null }]
                });
                return;
            }

            // 手机号格式校验
            var phoneResult = validatePhone(phone);
            if (!phoneResult.valid) {
                showModal({
                    icon: '📱',
                    title: '号码格式不正确',
                    message: phoneResult.message + '<br><span style="color:#999;font-size:0.85rem;">示例：13812345678 或 0851-12345678</span>',
                    buttons: [{ text: '重新输入', type: 'primary', onClick: null }]
                });
                return;
            }

            // 构造订单信息
            var cart;
            try { cart = getCart(); } catch(e) { cart = []; }
            if (!Array.isArray(cart)) cart = [];
            var total;
            try { total = getCartTotal(); } catch(e) { total = 0; }

            // 保存订单到 localStorage
            var order = saveOrder({
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                customerRemark: remark,
                items: cart,
                total: total
            });

            console.log('订单已保存：', order);

            // 关闭结算弹窗
            closeCheckoutModal();

            // 重置表单
            document.getElementById('checkout-form').reset();

            // 重新加载购物车页面
            loadCart();
            updateCartBadge();

            // 显示支付弹窗（订单将在支付完成后才清空购物车）
            if (typeof showPaymentModal === 'function') {
                showPaymentModal(order, cart, total, name, phone);
                // 支付弹窗关闭后清空购物车
                // 注意：cart 已在前面保存，这里延迟清空防止用户关闭支付弹窗后丢失订单
            } else {
                // 兜底：如果支付模块未加载，使用旧版成功提示
                clearCart();
                showModal({
                    icon: '💳',
                    title: '订单已创建',
                    message:
                        '<div class="order-summary">' +
                        '<div><span class="label">订单编号</span><span class="order-id">' + order.id + '</span></div>' +
                        '<div><span class="label">下单时间</span>' + order.orderTimeDisplay + '</div>' +
                        '</div>' +
                        '<div class="payment-notice">' +
                        '<div class="title">💳 支付说明</div>我们的工作人员将在 <strong>24小时内</strong> 与您联系确认付款方式。</div>',
                    buttons: [
                        { text: '继续购物', type: 'default', onClick: function() { window.location.href = 'products.html'; } },
                        { text: '查看订单', type: 'primary', onClick: function() { window.location.href = 'order-history.html'; } }
                    ]
                });
            }
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            try {
                loadCart();
                if (typeof updateCartBadge === 'function') updateCartBadge();
            } catch(e) {
                console.error('购物车页面初始化失败：', e);
                document.getElementById('cart-empty').style.display = '';
            }
        });
    </script>
    <script src="nav.js"></script>
</body>
</html>
