<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系方式 - 贵州古芝源品牌管理有限公司</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        .contact-page {
            padding: 120px 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: 3rem;
        }
        .contact-info-section {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .contact-info-section h3 {
            color: var(--primary-green);
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .contact-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--cream);
        }
        .contact-item:last-child { border-bottom: none; }
        .contact-icon {
            width: 50px;
            height: 50px;
            background: var(--cream);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 1.5rem;
            flex-shrink: 0;
        }
        .contact-details h4 {
            color: var(--primary-green);
            margin-bottom: 0.5rem;
        }
        .contact-details p {
            color: var(--text-light);
            line-height: 1.8;
        }
        .contact-form-section {
            background: var(--cream);
            padding: 3rem;
            border-radius: 10px;
        }
        .contact-form-section h3 {
            color: var(--primary-green);
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(45, 80, 22, 0.1);
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-green);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        .form-submit {
            width: 100%;
            padding: 1rem;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .form-submit:hover { background: var(--light-green); }
        .map-section {
            margin-top: 3rem;
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .map-section h3 {
            color: var(--primary-green);
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .map-container { width: 100%; height: 450px; border-radius: 10px; }
        .map-address {
            margin-top: 1rem;
            color: var(--text-light);
            font-size: 0.95rem;
            text-align: center;
        }
        .map-address a {
            color: var(--primary-green);
            text-decoration: none;
            margin-left: 0.8rem;
        }
        .map-address a:hover { text-decoration: underline; }
        .faq-section { margin-top: 3rem; }
        .faq-item {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        .faq-item:hover {
            box-shadow: 0 5px 20px rgba(45, 80, 22, 0.15);
        }
        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--primary-green);
            font-weight: bold;
            font-size: 1.1rem;
        }
        .faq-answer {
            margin-top: 1rem;
            color: var(--text-light);
            line-height: 1.8;
            display: none;
        }
        .faq-item.active .faq-answer { display: block; }
        .faq-toggle {
            font-size: 1.5rem;
            color: var(--primary-green);
            transition: transform 0.3s;
        }
        .faq-item.active .faq-toggle { transform: rotate(45deg); }
        @media (max-width: 768px) {
            .contact-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">
                <span class="logo-icon" id="logo-icon">芝</span>
                <span id="logo-text">古芝源</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li><a href="contact.html" style="color: var(--gold);">联系方式</a></li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" id="cart-badge">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 联系方式页面 -->
    <section class="contact-page" id="contact-content"></section>

    <!-- 页脚 -->
    <footer class="footer" id="footer"></footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    (async function init() {
        try {
            const [contactRes, siteRes] = await Promise.all([
                fetch('content/contact.json'),
                fetch('content/site.json')
            ]);
            const contact = await contactRes.json();
            const site = await siteRes.json();
            const co = site.company || {};
            const ft = site.footer || {};
            const sc = site.contact || {};

            // === Logo ===
            if (co.logoImage) {
                var li = document.getElementById('logo-img');
                if (li) { li.src = co.logoImage; li.style.display = ''; }
                var lc = document.getElementById('logo-icon');
                if (lc) lc.style.display = 'none';
            }
            document.getElementById('logo-text').textContent = co.shortName || '古芝源';
            document.title = (contact.title || '联系方式') + ' - ' + (co.name || '贵州古芝源品牌管理有限公司');

            // === 构建整个页面内容 ===
            var html = '';

            // 标题
            html += '<h2 class="section-title fade-in">' + (contact.title || '联系方式') + '</h2>';
            html += '<p class="section-subtitle fade-in">' + (contact.subtitle || '期待与您携手，共创健康未来') + '</p>';

            // 两栏布局
            html += '<div class="contact-container">';

            // 左侧：联系信息
            html += '<div class="contact-info-section fade-in">';
            html += '<h3>' + (contact.infoTitle || '联系信息') + '</h3>';
            var items = contact.items || [];
            items.forEach(function(item) {
                html += '<div class="contact-item">';
                html += '<div class="contact-icon">' + (item.icon || '📍') + '</div>';
                html += '<div class="contact-details">';
                html += '<h4>' + item.name + '</h4>';
                html += '<p>' + (item.description || '').replace(/<br>/g, '<br>') + '</p>';
                html += '</div></div>';
            });
            html += '</div>';

            // 右侧：在线留言表单
            html += '<div class="contact-form-section fade-in">';
            html += '<h3>' + (contact.formTitle || '在线留言') + '</h3>';
            html += '<form id="contactForm">';
            html += '<div class="form-group"><label for="name">姓名 *</label><input type="text" id="name" name="name" required></div>';
            html += '<div class="form-group"><label for="phone">电话 *</label><input type="tel" id="phone" name="phone" required></div>';
            html += '<div class="form-group"><label for="email">邮箱</label><input type="email" id="email" name="email"></div>';
            html += '<div class="form-group"><label for="subject">' + (contact.formSubject || '咨询类型 *') + '</label>';
            html += '<select id="subject" name="subject" required><option value="">请选择咨询类型</option>';
            html += '<option value="product">产品咨询</option><option value="cooperation">商务合作</option>';
            html += '<option value="agent">代理加盟</option><option value="complaint">投诉建议</option><option value="other">其他</option>';
            html += '</select></div>';
            html += '<div class="form-group"><label for="message">留言内容 *</label>';
            html += '<textarea id="message" name="message" required placeholder="请详细描述您的需求或问题..."></textarea></div>';
            html += '<button type="submit" class="form-submit">提交留言</button></form>';
            html += '</div></div>';

            // 地图
            html += '<div class="map-section fade-in">';
            html += '<h3>' + (contact.mapTitle || '公司位置') + '</h3>';
            html += '<div class="map-container" id="contact-map"></div>';
            html += '<div class="map-address">' + (contact.mapText || '').replace(/<br>/g, '<br>') + '';
            html += ' <a href="https://uri.amap.com/marker?position=' + (contact.mapLng || '') + ',' + (contact.mapLat || '') + '" target="_blank">高德导航</a>';
            html += ' <a href="https://api.map.baidu.com/marker?location=' + (contact.mapLat || '') + ',' + (contact.mapLng || '') + '&title=古芝源" target="_blank">百度地图</a>';
            html += '</div></div>';

            // FAQ
            var faq = contact.faq || {};
            var faqItems = faq.items || [];
            if (faqItems.length > 0) {
                html += '<div class="faq-section fade-in">';
                html += '<h2 class="section-title">' + (faq.title || '常见问题') + '</h2>';
                html += '<div class="faq-list" style="max-width:900px;margin:3rem auto 0;">';
                faqItems.forEach(function(item) {
                    html += '<div class="faq-item">';
                    html += '<div class="faq-question"><span>' + item.question + '</span><span class="faq-toggle">+</span></div>';
                    html += '<div class="faq-answer"><p>' + (item.answer || '').replace(/<br>/g, '<br>') + '</p></div>';
                    html += '</div>';
                });
                html += '</div></div>';
            }

            document.getElementById('contact-content').innerHTML = html;

            // === 表单提交 ===
            var form = document.getElementById('contactForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    alert('感谢您的留言！我们将尽快与您联系。');
                    form.reset();
                });
            }

            // === FAQ 切换 ===
            document.querySelectorAll('.faq-item').forEach(function(item) {
                item.addEventListener('click', function() { this.classList.toggle('active'); });
            });

            // === 初始化地图 ===
            var lat = contact.mapLat || 27.642;
            var lng = contact.mapLng || 106.895;
            var zoom = contact.mapZoom || 16;
            setTimeout(function() {
                var mapEl = document.getElementById('contact-map');
                if (!mapEl || typeof L === 'undefined') return;
                var map = L.map('contact-map').setView([lat, lng], zoom);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
                var icon = L.divIcon({
                    html: '<div style="background:var(--primary-green);color:white;width:40px;height:40px;border-radius:50% 50% 0 50%;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 15px rgba(0,0,0,0.3);"><span style="transform:rotate(45deg);">芝</span></div>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 40],
                    popupAnchor: [0, -40]
                });
                L.marker([lat, lng], { icon: icon }).addTo(map)
                    .bindPopup('<b>贵州古芝源品牌管理有限公司</b><br>' + (contact.mapText || '').replace(/<br>/g, '<br>'))
                    .openPopup();
            }, 300);

            // === 页脚 ===
            document.getElementById('footer').innerHTML =
                '<p>' + (ft.copyright || '© 2026 贵州古芝源品牌管理有限公司 版权所有') + '</p>' +
                '<p>' + (ft.slogan || '传承古法 · 芝养人生') + '</p>';

            // === 动画 ===
            var fadeIns = document.querySelectorAll('.fade-in');
            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            fadeIns.forEach(function(el) { observer.observe(el); });

        } catch (e) {
            console.error('Failed to load contact page:', e);
        }
        updateCartBadge();
    })();
    </script>
    <script src="cart.js"></script>
</body>
</html>
