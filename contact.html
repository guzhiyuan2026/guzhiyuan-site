<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系方式 - 古芝源</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .contact-page { padding: 120px 2rem 5rem; max-width: 1200px; margin: 0 auto; }
        .contact-container { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-top: 3rem; }
        .contact-info-section { background: white; padding: 3rem; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .contact-info-section h3 { color: var(--primary-green); margin-bottom: 2rem; font-size: 1.8rem; }
        .contact-item { display: flex; align-items: flex-start; margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--cream); }
        .contact-item:last-child { border-bottom: none; }
        .contact-icon { width: 50px; height: 50px; background: var(--cream); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-right: 1.5rem; flex-shrink: 0; }
        .contact-details h4 { color: var(--primary-green); margin-bottom: 0.5rem; }
        .contact-details p { color: var(--text-light); line-height: 1.8; }
        .contact-form-section { background: var(--cream); padding: 3rem; border-radius: 10px; }
        .contact-form-section h3 { color: var(--primary-green); margin-bottom: 2rem; font-size: 1.8rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; color: var(--text-dark); margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 1rem; border: 2px solid rgba(45,80,22,0.1); border-radius: 5px;
            font-size: 1rem; font-family: inherit; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary-green); }
        .form-group textarea { resize: vertical; min-height: 150px; }
        .form-submit { width: 100%; padding: 1rem; background: var(--primary-green); color: white; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; transition: background 0.3s; }
        .form-submit:hover { background: var(--light-green); }
        .map-section { margin-top: 3rem; background: white; padding: 3rem; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .map-section h3 { color: var(--primary-green); margin-bottom: 2rem; font-size: 1.8rem; }
        .map-container { width: 100%; height: 450px; border-radius: 10px; overflow: hidden; z-index: 1; }
        .map-address { margin-top: 1rem; text-align: center; color: var(--text-light); font-size: 0.95rem; }
        .map-address a { color: var(--primary-green); text-decoration: none; font-weight: bold; }
        .map-address a:hover { text-decoration: underline; }
        .faq-section { margin-top: 3rem; }
        .faq-item { background: white; padding: 2rem; border-radius: 10px; margin-bottom: 1rem; box-shadow: 0 5px 20px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.3s; }
        .faq-item:hover { box-shadow: 0 5px 20px rgba(45,80,22,0.15); }
        .faq-question { display: flex; justify-content: space-between; align-items: center; color: var(--primary-green); font-weight: bold; font-size: 1.1rem; }
        .faq-answer { margin-top: 1rem; color: var(--text-light); line-height: 1.8; display: none; }
        .faq-item.active .faq-answer { display: block; }
        .faq-toggle { font-size: 1.5rem; color: var(--primary-green); transition: transform 0.3s; }
        .faq-item.active .faq-toggle { transform: rotate(45deg); }
        @media (max-width: 768px) { .contact-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">
                <span class="logo-icon" id="logo-icon">芝</span>
                古芝源
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li><a href="contact.html" style="color: var(--gold);">联系方式</a></li>
            </ul>
        </div>
    </nav>

    <section class="contact-page">
        <h2 class="section-title fade-in" id="contact-title">联系方式</h2>
        <p class="section-subtitle fade-in" id="contact-subtitle"></p>

        <div class="contact-container">
            <div class="contact-info-section fade-in" id="contact-info"></div>
            <div class="contact-form-section fade-in" id="contact-form-area"></div>
        </div>

        <div class="map-section fade-in" id="map-section"></div>
        <div class="faq-section fade-in" id="faq-section"></div>
    </section>

    <footer class="footer" id="footer"></footer>

    <script>
        async function init() {
            try {
                const [data, site] = await Promise.all([
                    fetch('content/contact.json').then(r => r.json()),
                    fetch('content/site.json').then(r => r.json())
                ]);

                // 站点标题
                document.title = '联系方式 - ' + site.company.shortName;

                // 页脚
                document.getElementById('footer').innerHTML =
                    '<p>' + site.footer.copyright + '</p><p>' + site.footer.slogan + '</p>';

                // 标题
                document.getElementById('contact-title').textContent = data.title;
                document.getElementById('contact-subtitle').textContent = data.subtitle;

                // 联系信息
                document.getElementById('contact-info').innerHTML =
                    '<h3>' + data.infoTitle + '</h3>' +
                    data.items.map(c =>
                        '<div class="contact-item">' +
                        '<div class="contact-icon">' + c.icon + '</div>' +
                        '<div class="contact-details">' +
                        '<h4>' + c.name + '</h4>' +
                        '<p>' + c.description + '</p>' +
                        '</div></div>'
                    ).join('');

                // 联系表单
                document.getElementById('contact-form-area').innerHTML =
                    '<h3>' + data.formTitle + '</h3>' +
                    '<form id="contactForm">' +
                    '<div class="form-group"><label>姓名 *</label><input type="text" name="name" required></div>' +
                    '<div class="form-group"><label>电话 *</label><input type="tel" name="phone" required></div>' +
                    '<div class="form-group"><label>邮箱</label><input type="email" name="email"></div>' +
                    '<div class="form-group"><label>' + data.formSubject + '</label>' +
                    '<select name="subject" required>' +
                    '<option value="">请选择咨询类型</option>' +
                    '<option value="product">产品咨询</option>' +
                    '<option value="cooperation">商务合作</option>' +
                    '<option value="agent">代理加盟</option>' +
                    '<option value="complaint">投诉建议</option>' +
                    '<option value="other">其他</option>' +
                    '</select></div>' +
                    '<div class="form-group"><label>留言内容 *</label><textarea name="message" required placeholder="请详细描述您的需求或问题..."></textarea></div>' +
                    '<button type="submit" class="form-submit">提交留言</button>' +
                    '</form>';

                document.getElementById('contactForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    alert('感谢您的留言！我们将尽快与您联系。');
                    this.reset();
                });

                // 地图
                var lat = data.mapLat || 27.642;
                var lng = data.mapLng || 106.895;
                var zoom = data.mapZoom || 16;
                var addrText = data.mapText.replace(/<br>/g, '，').replace(/📍\s*/g, '');
                document.getElementById('map-section').innerHTML =
                    '<h3>' + data.mapTitle + '</h3>' +
                    '<div id="company-map" class="map-container"></div>' +
                    '<div class="map-address">' + data.mapText +
                    ' <a href="https://uri.amap.com/marker?position=' + lng + ',' + lat + '&name=贵州古芝源品牌管理有限公司&callnative=1" target="_blank" rel="noopener">📱 手机导航</a>' +
                    ' | <a href="https://map.baidu.com/search/遵义碧桂园一期" target="_blank" rel="noopener">🗺️ 百度地图</a></div>';

                // 初始化 Leaflet 地图
                setTimeout(function() {
                    var mapEl = document.getElementById('company-map');
                    if (!mapEl) return;
                    var map = L.map('company-map', {
                        center: [lat, lng],
                        zoom: zoom,
                        scrollWheelZoom: false
                    });
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                        maxZoom: 19
                    }).addTo(map);
                    // 自定义图标
                    var markerIcon = L.divIcon({
                        className: 'custom-marker',
                        html: '<div style="background:#2d5016;color:#c8a84e;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,0.3);border:3px solid #c8a84e;"><span style="transform:rotate(45deg);font-size:16px;">芝</span></div>',
                        iconSize: [36, 36],
                        iconAnchor: [18, 36],
                        popupAnchor: [0, -40]
                    });
                    L.marker([lat, lng], { icon: markerIcon })
                        .addTo(map)
                        .bindPopup('<b>贵州古芝源品牌管理有限公司</b><br>' + addrText)
                        .openPopup();
                }, 300);

                // FAQ
                if (data.faq && data.faq.items) {
                    document.getElementById('faq-section').innerHTML =
                        '<h2 class="section-title">' + data.faq.title + '</h2>' +
                        '<div style="max-width:900px;margin:3rem auto 0;">' +
                        data.faq.items.map((f, i) =>
                            '<div class="faq-item" onclick="this.classList.toggle(\'active\')">' +
                            '<div class="faq-question"><span>' + f.question + '</span><span class="faq-toggle">+</span></div>' +
                            '<div class="faq-answer"><p>' + f.answer + '</p></div>' +
                            '</div>'
                        ).join('') + '</div>';
                }

                initAnimations();
            } catch (err) {
                console.error('加载联系我们数据失败:', err);
            }
        }

        function initAnimations() {
            const els = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            els.forEach(el => observer.observe(el));
        }

        init();
    </script>
    <script>
    (async function(){
        try{
            const r=await fetch('content/site.json');
            const s=await r.json();
            if(s.company&&s.company.logoImage){
                var i=document.getElementById('logo-img');
                if(i){i.src=s.company.logoImage;i.style.display='';}
                var c=document.getElementById('logo-icon');
                if(c)c.style.display='none';
            }
        }catch(e){}
    })();
    </script>
</body>
</html>
