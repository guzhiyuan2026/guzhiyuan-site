<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵州古芝源品牌管理有限公司 - 传承古法·芝养人生</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 首页特有样式 */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(45, 80, 22, 0.7), rgba(62, 39, 35, 0.8)),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect fill="%232d5016" width="1200" height="800"/><circle fill="%234a7c23" opacity="0.3" cx="200" cy="200" r="300"/><circle fill="%238b6f47" opacity="0.2" cx="800" cy="600" r="400"/></svg>');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding-top: 80px;
        }
        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: 5px;
        }
        .hero-content .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--gold);
            font-style: italic;
        }
        .hero-content p {
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 2rem;
            line-height: 2;
            white-space: pre-line;
        }
        .cta-button {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--gold);
            color: var(--dark-brown);
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(212, 165, 116, 0.3);
        }
        .cta-button:hover {
            background: var(--earth-brown);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 111, 71, 0.4);
        }

        /* 首页区域 */
        .home-section { padding: 5rem 2rem; max-width: 1200px; margin: 0 auto; }
        .home-section.alt { background: white; padding: 5rem 2rem; }
        .home-section.alt .container { max-width: 1200px; margin: 0 auto; }
        .home-section.dark { background: linear-gradient(135deg, var(--primary-green), var(--dark-brown)); color: white; padding: 5rem 2rem; }
        .home-section.dark .section-title { color: white; }
        .home-section.dark .section-subtitle { color: var(--gold); }
        .home-section.dark .container { max-width: 1200px; margin: 0 auto; }

        /* 关于我们摘要 */
        .about-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            margin-top: 3rem;
        }
        .about-text {
            font-size: 1.05rem;
            line-height: 2;
            color: var(--text-light);
        }
        .about-text p { margin-bottom: 1rem; }
        .about-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.2);
        }
        .more-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .more-link:hover { color: var(--earth-brown); }
        .more-link::after { content: ' →'; }

        /* 产品卡片 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .product-card {
            background: var(--cream);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(212, 165, 116, 0.3);
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.15);
        }
        .product-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-green);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
        }
        .product-card h3 {
            color: var(--primary-green);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        .product-card p { color: var(--text-light); line-height: 1.8; }

        /* 文化理念 */
        .culture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .culture-item { text-align: center; padding: 2rem; }
        .culture-item .icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
        .culture-item h3 { font-size: 1.5rem; margin-bottom: 1rem; color: var(--gold); }
        .culture-item p { line-height: 1.8; opacity: 0.9; }

        /* 联系项目 */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .contact-item {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .contact-item .icon { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
        .contact-item h3 { color: var(--primary-green); margin-bottom: 1rem; }
        .contact-item p { color: var(--text-light); line-height: 1.8; }

        /* 响应式 */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2rem; }
            .about-summary { grid-template-columns: 1fr; }
            .section-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 — 与所有子页面统一 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">
                <span class="logo-icon" id="logo-icon">芝</span>
                <span id="logo-text">古芝源</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" style="color: var(--gold);">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero 主视觉 -->
    <section class="hero">
        <div class="hero-content fade-in" id="hero-content"></div>
    </section>

    <!-- 关于我们摘要 -->
    <section class="home-section">
        <h2 class="section-title fade-in" id="about-title"></h2>
        <p class="section-subtitle fade-in" id="about-subtitle"></p>
        <div class="about-summary">
            <div class="about-text fade-in" id="about-text"></div>
            <div class="about-image fade-in"><span>🌿</span></div>
        </div>
        <div style="text-align:center; margin-top:2rem;">
            <a href="about.html" class="more-link">了解更多关于我们</a>
        </div>
    </section>

    <!-- 产品展示摘要 -->
    <section class="home-section alt">
        <div class="container">
            <h2 class="section-title fade-in" id="home-products-title"></h2>
            <p class="section-subtitle fade-in" id="home-products-subtitle"></p>
            <div class="product-grid" id="home-products-grid"></div>
            <div style="text-align:center; margin-top:2rem;">
                <a href="products.html" class="more-link">查看全部产品</a>
            </div>
        </div>
    </section>

    <!-- 文化理念 -->
    <section class="home-section dark">
        <div class="container">
            <h2 class="section-title fade-in" id="culture-title"></h2>
            <p class="section-subtitle fade-in" id="culture-subtitle"></p>
            <div class="culture-grid" id="culture-grid"></div>
        </div>
    </section>

    <!-- 联系方式摘要 -->
    <section class="home-section">
        <h2 class="section-title fade-in" id="home-contact-title"></h2>
        <p class="section-subtitle fade-in" id="home-contact-subtitle"></p>
        <div class="contact-grid" id="home-contact-grid"></div>
        <div style="text-align:center; margin-top:2rem;">
            <a href="contact.html" class="more-link">查看完整联系方式</a>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" id="footer"></footer>

    <script>
        async function loadJSON(path) {
            const resp = await fetch(path);
            if (!resp.ok) throw new Error('Failed to load ' + path);
            return resp.json();
        }

        async function init() {
            try {
                const [site, home] = await Promise.all([
                    loadJSON('content/site.json'),
                    loadJSON('content/home.json')
                ]);

                // 更新导航栏 Logo
                if (site.company.logoImage) {
                    const logoImg = document.getElementById('logo-img');
                    logoImg.src = site.company.logoImage;
                    logoImg.style.display = '';
                    document.getElementById('logo-icon').style.display = 'none';
                } else {
                    document.getElementById('logo-icon').textContent = site.company.logoIcon;
                    document.getElementById('logo-img').style.display = 'none';
                    document.getElementById('logo-icon').style.display = '';
                }
                document.getElementById('logo-text').textContent = site.company.shortName;

                // 更新页面标题
                document.title = site.company.name + ' - ' + site.company.slogan;

                // 更新页脚
                document.getElementById('footer').innerHTML =
                    '<p>' + site.footer.copyright + '</p><p>' + site.footer.slogan + '</p>';

                // Hero 主视觉
                const hero = document.getElementById('hero-content');
                hero.innerHTML = '<h1>' + home.hero.title + '</h1>' +
                    '<p class="subtitle">' + home.hero.subtitle + '</p>' +
                    '<p>' + home.hero.description.replace(/\n/g, '<br>') + '</p>' +
                    '<a href="about.html" class="cta-button">' + (home.hero.buttonText || '了解更多') + '</a>';

                // 关于我们摘要
                document.getElementById('about-title').textContent = home.about.title;
                document.getElementById('about-subtitle').textContent = home.about.subtitle;
                document.getElementById('about-text').innerHTML = home.about.paragraphs.map(function(p) {
                    return '<p>' + p + '</p>';
                }).join('');

                // 产品展示
                document.getElementById('home-products-title').textContent = home.products.title;
                document.getElementById('home-products-subtitle').textContent = home.products.subtitle;
                document.getElementById('home-products-grid').innerHTML = home.products.items.map(function(p) {
                    return '<div class="product-card fade-in"><div class="product-icon">' + p.icon +
                        '</div><h3>' + p.name + '</h3><p>' + p.description + '</p></div>';
                }).join('');

                // 文化理念
                document.getElementById('culture-title').textContent = home.culture.title;
                document.getElementById('culture-subtitle').textContent = home.culture.subtitle;
                document.getElementById('culture-grid').innerHTML = home.culture.items.map(function(c) {
                    return '<div class="culture-item fade-in"><span class="icon">' + c.icon +
                        '</span><h3>' + c.name + '</h3><p>' + c.description + '</p></div>';
                }).join('');

                // 联系方式
                document.getElementById('home-contact-title').textContent = home.contact.title;
                document.getElementById('home-contact-subtitle').textContent = home.contact.subtitle;
                document.getElementById('home-contact-grid').innerHTML = home.contact.items.map(function(c) {
                    return '<div class="contact-item fade-in"><span class="icon">' + c.icon +
                        '</span><h3>' + c.name + '</h3><p>' + c.description + '</p></div>';
                }).join('');

                // 滚动动画
                initAnimations();
            } catch (err) {
                console.error('数据加载失败:', err);
            }
        }

        function initAnimations() {
            var els = document.querySelectorAll('.fade-in');
            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });
            els.forEach(function(el) { observer.observe(el); });
        }

        init();
    </script>
</body>
</html>
