<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵州古芝源品牌管理有限公司 - 传承古法·芝养人生</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        /* ===== 首页专属样式 ===== */

        /* Hero区域 */
        .hero {
            height: 100vh;
            background: linear-gradient(135deg, rgba(45,80,22,0.85), rgba(139,111,71,0.75)),
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><rect fill="%232d5016" width="1920" height="1080"/><text fill="%23f5f0e8" font-family="serif" font-size="30" opacity="0.05" x="50" y="50">古芝源</text></svg>');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--white);
            padding-top: 80px;
        }

        .hero-content {
            max-width: 800px;
            padding: 0 2rem;
        }

        .hero-content h1 {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
        }

        .hero-content .subtitle {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 2rem;
            font-style: italic;
            letter-spacing: 3px;
        }

        .hero-content .desc {
            font-size: 1.1rem;
            line-height: 2;
            margin-bottom: 2.5rem;
            opacity: 0.95;
        }

        .hero-content .btn-gold {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--gold);
            color: var(--dark-brown);
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .hero-content .btn-gold:hover {
            background: #e0b88a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* 板块公共样式 */
        .section-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary-green);
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--light-green);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .section-link {
            text-align: center;
            margin-top: 2rem;
        }

        .section-link a {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .section-link a:hover {
            background: var(--light-green);
        }

        /* 关于我们 */
        .about-section {
            background: var(--white);
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .about-text p {
            margin-bottom: 1rem;
            color: var(--text-dark);
            line-height: 1.8;
        }

        .about-image {
            width: 100%;
            height: 300px;
            background: var(--cream);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
        }

        /* 产品展示 */
        .products-section {
            background: var(--cream);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .product-card .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .product-card h3 {
            color: var(--primary-green);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .product-card p {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* 文化理念 */
        .culture-section {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-brown));
            color: white;
        }

        .culture-section .section-title {
            color: white;
        }

        .culture-section .section-subtitle {
            color: var(--gold);
        }

        .culture-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.3rem;
        }

        @media (max-width: 992px) {
            .culture-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 600px) {
            .culture-grid {
                grid-template-columns: 1fr;
            }
        }

        .culture-item {
            background: rgba(255,255,255,0.1);
            padding: 1.8rem 1.1rem;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .culture-item .icon {
            font-size: 2.4rem;
            margin-bottom: 0.7rem;
        }

        .culture-item h3 {
            font-size: 0.95rem;
            margin-bottom: 0.35rem;
            color: var(--gold);
            font-weight: 700;
        }

        .culture-item .subtitle {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            line-height: 1.45;
            opacity: 0.95;
        }

        .culture-item p {
            font-size: 0.9rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .culture-section .section-link a {
            background: var(--gold);
            color: var(--dark-brown);
        }

        .culture-section .section-link a:hover {
            background: #e0b88a;
        }

        /* 联系方式 */
        .contact-section {
            background: var(--white);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .contact-card {
            background: var(--cream);
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(139,111,71,0.1);
        }

        .contact-card .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .contact-card h3 {
            font-size: 1rem;
            color: var(--primary-green);
            margin-bottom: 0.3rem;
        }

        .contact-card p {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* 购物车角标 */
        .cart-link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .cart-icon {
            font-size: 1.2rem;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -12px;
            background: var(--gold);
            color: var(--white);
            font-size: 0.7rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .cart-badge.show {
            display: flex;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2rem;
                letter-spacing: 4px;
            }

            .hero-content .subtitle {
                font-size: 1.3rem;
            }

            .hero-content .desc {
                font-size: 1rem;
            }

            .about-content {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" id="logo-link">
                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">
                <span class="logo-icon" id="logo-icon">芝</span>
                <span id="logo-text">古芝源</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <!-- JS 动态生成 -->
            </ul>
        </div>
    </nav>

    <!-- Hero区域 -->
    <section class="hero" id="hero">
        <div class="hero-content fade-in">
            <h1 id="hero-title">贵州古芝源品牌管理有限公司</h1>
            <p class="subtitle" id="hero-subtitle">传承古法 · 芝养人生</p>
            <p class="desc" id="hero-desc">
                秉承千年中医药文化精髓，融合现代科技与古法工艺<br>
                致力于打造高品质中药材与健康养生产品<br>
                让传统智慧惠及现代生活
            </p>
            <a href="about.html" class="btn-gold" id="hero-btn">了解更多</a>
        </div>
    </section>

    <!-- 关于我们 -->
    <section class="section about-section" id="about">
        <div class="section-inner">
            <h2 class="section-title fade-in" id="about-title">关于我们</h2>
            <p class="section-subtitle fade-in" id="about-subtitle">扎根贵州，传承古法，守护健康</p>
            <div class="about-content">
                <div class="about-text fade-in" id="about-text">
                    <!-- JS 动态生成 -->
                </div>
                <div class="about-image fade-in" id="about-image">
                    <span>🌿</span>
                </div>
            </div>
            <div class="section-link fade-in">
                <a href="about.html">查看详情 →</a>
            </div>
        </div>
    </section>

    <!-- 产品展示 -->
    <section class="section products-section" id="products">
        <div class="section-inner">
            <h2 class="section-title fade-in" id="products-title">产品展示</h2>
            <p class="section-subtitle fade-in" id="products-subtitle">道地药材 · 古法炮制 · 品质保证</p>
            <div class="product-grid" id="products-grid">
                <!-- JS 动态生成 -->
            </div>
            <div class="section-link fade-in">
                <a href="products.html">查看全部产品 →</a>
            </div>
        </div>
    </section>

    <!-- 文化理念 -->
    <section class="section culture-section" id="culture">
        <div class="section-inner">
            <h2 class="section-title fade-in" id="culture-title">文化理念</h2>
            <p class="section-subtitle fade-in" id="culture-subtitle">传承中医药文化 · 守护国民健康</p>
            <div class="culture-grid" id="culture-grid">
                <!-- JS 动态生成 -->
            </div>
            <div class="section-link fade-in">
                <a href="about.html#culture">了解更多 →</a>
            </div>
        </div>
    </section>

    <!-- 联系方式 -->
    <section class="section contact-section" id="contact">
        <div class="section-inner">
            <h2 class="section-title fade-in" id="contact-title">联系方式</h2>
            <p class="section-subtitle fade-in" id="contact-subtitle">期待与您携手，共创健康未来</p>
            <div class="contact-grid" id="contact-grid">
                <!-- JS 动态生成 -->
            </div>
            <div class="section-link fade-in">
                <a href="contact.html">联系我们 →</a>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" id="footer">
        <!-- JS 动态生成 -->
    </footer>

    <script>
    // ============ 数据加载 ============
    async function loadSiteData() {
        try {
            const res = await fetch('content/site.json?t=' + Date.now());
            const site = await res.json();
            renderLogo(site);
            renderNav(site);
            renderFooter(site);
        } catch(e) { console.error('site.json load error:', e); }
    }

    function renderLogo(site) {
        const co = site.company || {};
        const img = document.getElementById('logo-img');
        const icon = document.getElementById('logo-icon');
        const text = document.getElementById('logo-text');
        // 使用短名称，避免"贵州古芝源品牌管理有限公司"撑破导航栏
        text.textContent = co.shortName || co.name || '古芝源';
        if (co.logoImage) {
            img.src = co.logoImage;
            img.style.display = '';
            icon.style.display = 'none';
            // 图片加载失败回退到 icon+text
            img.onerror = function() {
                img.style.display = 'none';
                icon.style.display = '';
            };
        }
    }

    function renderNav(site) {
        const nav = document.getElementById('nav-links');
        const navItems = (site.nav || [
            { file: 'index.html', label: '首页' },
            { file: 'about.html', label: '关于我们' },
            { file: 'products.html', label: '产品中心' },
            { file: 'news.html', label: '新闻动态' },
            { file: 'contact.html', label: '联系方式' }
        ]);
        const current = window.location.pathname.split('/').pop() || 'index.html';
        let html = '';
        navItems.forEach(item => {
            const isActive = item.file === current;
            const hasChildren = item.children && item.children.length > 0;
            if (hasChildren) {
                // 下拉菜单
                const isChildActive = item.children.some(c => c.file === current);
                html += `<li class="dropdown ${isChildActive ? 'active' : ''}">`;
                html += `  <a href="${item.file || '#'}" class="${isChildActive ? 'active-link' : ''}" onclick="event.preventDefault();event.stopPropagation();this.parentElement.toggleAttribute('data-open');">${item.label} ▾<span class="arrow">▼</span></a>`;
                html += `  <ul class="dropdown-menu">`;
                item.children.forEach(child => {
                    const isChild = child.file === current;
                    html += `    <li><a href="${child.file}" class="${isChild ? 'active-link' : ''}">${child.label}</a></li>`;
                });
                html += `  </ul>`;
                html += `</li>`;
            } else {
                // 普通链接
                html += `<li><a href="${item.file}" ${isActive ? 'style="color:var(--gold);"' : ''}>${item.label}</a></li>`;
            }
        });
        html += `
            <li>
                <a href="cart.html" class="cart-link">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-badge" id="cart-badge">0</span>
                </a>
            </li>`;
        nav.innerHTML = html;
        updateCartBadge();
    }

    function renderFooter(site) {
        const footer = document.getElementById('footer');
        if (!site.footer) return;
        const f = site.footer;
        const companyName = (site.company && site.company.name) || '贵州古芝源品牌管理有限公司';
        footer.innerHTML = `
            <p>© ${new Date().getFullYear()} ${companyName} 版权所有</p>
            <p>${f.slogan || '传承古法 · 芝养人生'}</p>
            <p style="margin-top:0.5rem;font-size:0.85rem;opacity:0.6;">
                ${(site.contact && site.contact.address) || ''} ${(site.contact && site.contact.phone) ? '| 电话：' + site.contact.phone : ''}
            </p>
        `;
    }

    // ============ 首页数据加载 ============
    async function loadHomeData() {
        try {
            const res = await fetch('content/home.json?t=' + Date.now());
            const home = await res.json();
            renderHero(home.hero);
            renderAbout(home.about);
            renderProducts(home.products);
            renderCulture(home.culture);
            renderContact(home.contact);
        } catch(e) {
            console.error('home.json load error:', e);
        }
    }

    function renderHero(hero) {
        if (!hero) return;
        document.getElementById('hero-title').textContent = hero.title || '';
        document.getElementById('hero-subtitle').textContent = hero.subtitle || '';
        document.getElementById('hero-desc').innerHTML = (hero.description || '').replace(/\n/g, '<br>');
        const btn = document.getElementById('hero-btn');
        btn.textContent = hero.buttonText || '了解更多';
        btn.href = hero.buttonLink || 'about.html';
    }

    function renderAbout(about) {
        if (!about) return;
        document.getElementById('about-title').textContent = about.title || '';
        document.getElementById('about-subtitle').textContent = about.subtitle || '';
        const container = document.getElementById('about-text');
        const paragraphs = about.paragraphs || about.paragraph || [];
        container.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
    }

    function renderProducts(products) {
        if (!products) return;
        document.getElementById('products-title').textContent = products.title || '';
        document.getElementById('products-subtitle').textContent = products.subtitle || '';
        const grid = document.getElementById('products-grid');
        const items = products.items || [];
        grid.innerHTML = items.map(item => `
            <div class="product-card fade-in" onclick="location.href='products.html'">
                <div class="icon">${item.icon || '🌿'}</div>
                <h3>${item.name || ''}</h3>
                <p>${item.description || ''}</p>
            </div>
        `).join('');
    }

    function renderCulture(culture) {
        if (!culture) return;
        document.getElementById('culture-title').textContent = culture.title || '';
        document.getElementById('culture-subtitle').textContent = culture.subtitle || '';
        const grid = document.getElementById('culture-grid');
        const items = culture.items || [];
        grid.innerHTML = items.map(item => `
            <div class="culture-item fade-in">
                <div class="icon">${item.icon || ''}</div>
                <h3>${item.name || ''}</h3>
                ${item.subtitle ? `<div class="subtitle">${item.subtitle}</div>` : ''}
                <p>${item.description || ''}</p>
            </div>
        `).join('');
    }

    function renderContact(contact) {
        if (!contact) return;
        document.getElementById('contact-title').textContent = contact.title || '';
        document.getElementById('contact-subtitle').textContent = contact.subtitle || '';
        const grid = document.getElementById('contact-grid');
        const items = contact.items || [];
        grid.innerHTML = items.map(item => `
            <div class="contact-card fade-in">
                <div class="icon">${item.icon || ''}</div>
                <h3>${item.name || ''}</h3>
                <p>${item.description || ''}</p>
            </div>
        `).join('');
    }

    // ============ 购物车角标 ============
    function getCart() {
        try { return JSON.parse(localStorage.getItem('guzhiyuan_cart') || '[]'); }
        catch(e) { return []; }
    }
    function getCartCount() {
        return getCart().reduce((s, i) => s + i.quantity, 0);
    }
    function updateCartBadge() {
        var retryCount = arguments[0] || 0;
        const badge = document.getElementById('cart-badge');
        if (!badge) {
            if (retryCount < 5) setTimeout(function() { updateCartBadge(retryCount + 1); }, 150);
            return;
        }
        const count = getCartCount();
        badge.textContent = count > 99 ? '99+' : count;
        badge.setAttribute('data-count', String(count));
        if (count > 0) {
            badge.classList.add('visible', 'show');
            badge.style.display = 'flex';
        } else {
            badge.classList.remove('visible', 'show');
            badge.style.display = 'none';
        }
    }

    // ============ 初始化 ============
    (async function() {
        await loadSiteData();
        await loadHomeData();

        // 滚动动画
        const fadeInElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        fadeInElements.forEach(el => observer.observe(el));

        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(45,80,22,0.98)';
            } else {
                navbar.style.background = 'rgba(45,80,22,0.95)';
            }
        });
    })();
    </script>
    <script src="cart.js?v=20260618d"></script>
    <script src="nav.js"></script>
</body>
</html>
