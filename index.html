<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵州古芝源品牌管理有限公司 - 传承古法·芝养人生</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" id="logo-link">
                <img id="logo-img" src="" alt="" style="display:none;height:40px;object-fit:contain;">
                <span class="logo-icon" id="logo-icon">芝</span>
                <span id="logo-text">古芝源</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <!-- JS 动态生成 -->
            </ul>
        </div>
    </nav>

    <!-- Hero区域 -->
    <section class="hero" id="hero-section">
        <div class="hero-content fade-in">
            <h1 id="hero-title">贵州古芝源品牌管理有限公司</h1>
            <p class="subtitle" id="hero-subtitle">融合现代科技，传承汉方智慧</p>
            <p id="hero-desc">秉承千年中医药文化精髓，融合现代科技与古法工艺<br>
                致力于打造高品质中药材与健康养生产品<br>
                让传统智慧惠及现代生活</p>
            <a href="about.html" class="cta-button" id="hero-btn">了解更多</a>
        </div>
    </section>

    <!-- 关于我们 -->
    <section class="section" id="about-section">
        <h2 class="section-title fade-in" id="about-title">关于我们</h2>
        <p class="section-subtitle fade-in" id="about-subtitle">扎根贵州，传承古法，守护健康</p>
        <div class="about-content">
            <div class="about-text fade-in" id="about-text">
                <!-- JS 动态生成 -->
            </div>
            <div class="about-image fade-in" id="about-image">
                <span>🌿</span>
            </div>
        </div>
        <div style="text-align:center;margin-top:2rem;">
            <a href="about.html" class="btn-primary fade-in">查看详情 →</a>
        </div>
    </section>

    <!-- 产品展示 -->
    <section class="products" id="products-section">
        <div class="section">
            <h2 class="section-title fade-in" id="products-title">产品展示</h2>
            <p class="section-subtitle fade-in" id="products-subtitle">道地药材 · 古法炮制 · 品质保证</p>
            <div class="product-grid" id="products-grid">
                <!-- JS 动态生成 -->
            </div>
            <div style="text-align:center;margin-top:2rem;">
                <a href="products.html" class="btn-primary fade-in">查看全部产品 →</a>
            </div>
        </div>
    </section>

    <!-- 文化理念 -->
    <section class="culture" id="culture-section">
        <div class="culture-content">
            <h2 class="section-title fade-in" style="color: white;" id="culture-title">文化理念</h2>
            <p class="section-subtitle fade-in" style="color: var(--gold);" id="culture-subtitle">传承中医药文化 · 守护国民健康</p>
            <div class="culture-grid" id="culture-grid">
                <!-- JS 动态生成 -->
            </div>
            <div style="text-align:center;margin-top:2rem;">
                <a href="about.html#culture" class="btn-secondary fade-in">了解更多 →</a>
            </div>
        </div>
    </section>

    <!-- 联系方式 -->
    <section class="section" id="contact-section">
        <h2 class="section-title fade-in" id="contact-title">联系方式</h2>
        <p class="section-subtitle fade-in" id="contact-subtitle">期待与您携手，共创健康未来</p>
        <div class="contact-info" id="contact-info">
            <!-- JS 动态生成 -->
        </div>
        <div style="text-align:center;margin-top:2rem;">
            <a href="contact.html" class="btn-primary fade-in">联系我们 →</a>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" id="footer">
        <!-- JS 动态生成 -->
    </footer>

    <script>
    // ============ 数据加载 ============
    async function loadSiteData() {
        try {
            const res = await fetch('content/site.json');
            const site = await res.json();
            renderLogo(site);
            renderNav(site);
            renderFooter(site);
        } catch(e) { console.error('site.json load error:', e); }
    }

    function renderLogo(site) {
        const img = document.getElementById('logo-img');
        const icon = document.getElementById('logo-icon');
        const text = document.getElementById('logo-text');
        if (site.company && site.company.logoImage) {
            img.src = site.company.logoImage;
            img.style.display = '';
            icon.style.display = 'none';
        }
        if (site.company && site.company.name) {
            text.textContent = site.company.name;
        }
    }

    function renderNav(site) {
        const nav = document.getElementById('nav-links');
        const pages = [
            { file: 'index.html', label: '首页' },
            { file: 'about.html', label: '关于我们' },
            { file: 'products.html', label: '产品中心' },
            { file: 'news.html', label: '新闻动态' },
            { file: 'contact.html', label: '联系方式' }
        ];
        const current = window.location.pathname.split('/').pop() || 'index.html';
        let html = pages.map(p => {
            const active = p.file === current ? 'style="color:var(--gold);"' : '';
            return `<li><a href="${p.file}" ${active}>${p.label}</a></li>`;
        }).join('');
        html += `
            <li>
                <a href="cart.html" class="cart-link">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-badge" id="cart-badge">0</span>
                </a>
            </li>`;
        nav.innerHTML = html;
        updateCartBadge();
    }

    function renderFooter(site) {
        const footer = document.getElementById('footer');
        if (!site.site || !site.site.footer) return;
        const f = site.site.footer;
        footer.innerHTML = `
            <p>© ${new Date().getFullYear()} ${site.company?.name || '贵州古芝源品牌管理有限公司'} 版权所有</p>
            <p>${f.slogan || '传承古法 · 芝养人生'}</p>
            <p style="margin-top:0.5rem;font-size:0.85rem;opacity:0.6;">
                ${f.address || ''} ${f.phone ? '| 电话：' + f.phone : ''}
            </p>
        `;
    }

    // ============ 首页数据加载 ============
    async function loadHomeData() {
        try {
            const res = await fetch('content/home.json');
            const home = await res.json();
            renderHero(home.hero);
            renderAbout(home.about);
            renderProducts(home.products);
            renderCulture(home.culture);
            renderContact(home.contact);
        } catch(e) {
            console.error('home.json load error:', e);
        }
    }

    function renderHero(hero) {
        if (!hero) return;
        document.getElementById('hero-title').textContent = hero.title || '';
        document.getElementById('hero-subtitle').textContent = hero.subtitle || '';
        document.getElementById('hero-desc').innerHTML = (hero.description || '').replace(/\n/g, '<br>');
        const btn = document.getElementById('hero-btn');
        btn.textContent = hero.buttonText || '了解更多';
        btn.href = hero.buttonLink || 'about.html';
    }

    function renderAbout(about) {
        if (!about) return;
        document.getElementById('about-title').textContent = about.title || '';
        document.getElementById('about-subtitle').textContent = about.subtitle || '';
        const container = document.getElementById('about-text');
        const paragraphs = about.paragraphs || about.paragraph || [];
        container.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
    }

    function renderProducts(products) {
        if (!products) return;
        document.getElementById('products-title').textContent = products.title || '';
        document.getElementById('products-subtitle').textContent = products.subtitle || '';
        const grid = document.getElementById('products-grid');
        const items = products.items || [];
        grid.innerHTML = items.map(item => `
            <div class="product-card fade-in" onclick="location.href='products.html'">
                <div class="product-icon">${item.icon || '🌿'}</div>
                <h3>${item.name || ''}</h3>
                <p>${item.description || ''}</p>
            </div>
        `).join('');
    }

    function renderCulture(culture) {
        if (!culture) return;
        document.getElementById('culture-title').textContent = culture.title || '';
        document.getElementById('culture-subtitle').textContent = culture.subtitle || '';
        const grid = document.getElementById('culture-grid');
        const items = culture.items || [];
        grid.innerHTML = items.map(item => `
            <div class="culture-item fade-in">
                <span class="icon">${item.icon || ''}</span>
                <h3>${item.name || ''}</h3>
                <p>${item.description || ''}</p>
            </div>
        `).join('');
    }

    function renderContact(contact) {
        if (!contact) return;
        document.getElementById('contact-title').textContent = contact.title || '';
        document.getElementById('contact-subtitle').textContent = contact.subtitle || '';
        const info = document.getElementById('contact-info');
        const items = contact.items || [];
        info.innerHTML = items.map(item => `
            <div class="contact-item fade-in">
                <span class="icon">${item.icon || ''}</span>
                <h3>${item.name || ''}</h3>
                <p>${item.description || ''}</p>
            </div>
        `).join('');
    }

    // ============ 购物车角标 ============
    function getCart() {
        try { return JSON.parse(localStorage.getItem('guzhiyuan_cart') || '[]'); }
        catch(e) { return []; }
    }
    function getCartCount() {
        return getCart().reduce((s, i) => s + i.quantity, 0);
    }
    function updateCartBadge() {
        const badge = document.getElementById('cart-badge');
        if (!badge) return;
        const count = getCartCount();
        badge.textContent = count;
        badge.classList.toggle('show', count > 0);
    }

    // ============ 初始化 ============
    (async function() {
        await loadSiteData();
        await loadHomeData();

        // 滚动动画
        const fadeInElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        fadeInElements.forEach(el => observer.observe(el));

        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(45,80,22,0.98)';
            } else {
                navbar.style.background = 'rgba(45,80,22,0.95)';
            }
        });
    })();
    </script>
    <script src="cart.js"></script>
</body>
</html>
