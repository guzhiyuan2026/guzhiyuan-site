<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻动态 - 古芝源</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .news-page { padding: 120px 2rem 5rem; max-width: 1200px; margin: 0 auto; }
        .news-list { display: grid; gap: 2rem; margin-top: 3rem; }
        .news-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: grid;
            grid-template-columns: 300px 1fr;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.15);
        }
        .news-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }
        .news-content { padding: 2rem; }
        .news-date { color: var(--text-light); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .news-category {
            display: inline-block;
            background: var(--cream);
            color: var(--primary-green);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .news-content h3 { color: var(--primary-green); font-size: 1.5rem; margin-bottom: 1rem; line-height: 1.5; }
        .news-content p { color: var(--text-light); line-height: 1.8; margin-bottom: 1rem; }
        .news-link {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: gap 0.3s;
        }
        .news-link:hover { gap: 1rem; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 3rem;
        }
        .page-btn {
            padding: 0.8rem 1.2rem;
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .page-btn.active { background: var(--primary-green); color: white; }
        .page-btn:hover { background: var(--primary-green); color: white; }
        @media (max-width: 768px) {
            .news-card { grid-template-columns: 1fr; }
            .news-image { height: 200px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">芝</span>
                古芝源
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html" style="color: var(--gold);">新闻动态</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>

    <section class="news-page">
        <h2 class="section-title fade-in" id="news-title">新闻动态</h2>
        <p class="section-subtitle fade-in" id="news-subtitle"></p>
        <div class="news-list" id="news-list"></div>
        <div class="pagination fade-in" id="pagination"></div>
    </section>

    <footer class="footer">
        <p>© 2026 贵州古芝源品牌管理有限公司 版权所有</p>
        <p>传承古法 · 芝养人生</p>
    </footer>

    <script>
        const ITEMS_PER_PAGE = 6;
        let allNews = [];
        let currentPage = 1;

        async function init() {
            try {
                const resp = await fetch('content/news.json');
                const data = await resp.json();
                document.getElementById('news-title').textContent = data.title;
                document.getElementById('news-subtitle').textContent = data.subtitle;
                allNews = data.items;
                renderPage(1);
            } catch (err) {
                console.error('新闻数据加载失败:', err);
            }
            initAnimations();
        }

        function renderPage(page) {
            currentPage = page;
            const start = (page - 1) * ITEMS_PER_PAGE;
            const items = allNews.slice(start, start + ITEMS_PER_PAGE);
            const list = document.getElementById('news-list');
            list.innerHTML = items.map(n =>
                '<div class="news-card fade-in" onclick="location.href=\'news-detail.html\'">' +
                '<div class="news-image">' + n.icon + '</div>' +
                '<div class="news-content">' +
                '<div class="news-date">' + n.date + '</div>' +
                '<span class="news-category">' + n.category + '</span>' +
                '<h3>' + n.title + '</h3>' +
                '<p>' + n.summary + '</p>' +
                '<span class="news-link">阅读全文 →</span>' +
                '</div></div>'
            ).join('');

            // 分页
            const totalPages = Math.ceil(allNews.length / ITEMS_PER_PAGE);
            const pag = document.getElementById('pagination');
            if (totalPages <= 1) { pag.innerHTML = ''; return; }
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += '<button class="page-btn' + (i === page ? ' active' : '') + '" onclick="renderPage(' + i + ')">' + i + '</button>';
            }
            pag.innerHTML = html;
            initAnimations();
        }

        function initAnimations() {
            const els = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            els.forEach(el => observer.observe(el));
        }

        init();
    </script>
</body>
</html>
