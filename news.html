<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻动态 - 贵州古芝源品牌管理有限公司</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .news-page {
            padding: 120px 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .news-list {
            display: grid;
            gap: 2rem;
            margin-top: 3rem;
        }
        .news-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: grid;
            grid-template-columns: 300px 1fr;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.15);
        }
        .news-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }
        .news-content { padding: 2rem; }
        .news-date {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .news-category {
            display: inline-block;
            background: var(--cream);
            color: var(--primary-green);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .news-content h3 {
            color: var(--primary-green);
            font-size: 1.5rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        .news-content p {
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        .news-link {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: gap 0.3s;
        }
        .news-link:hover { gap: 1rem; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 3rem;
        }
        .page-btn {
            padding: 0.8rem 1.2rem;
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .page-btn.active {
            background: var(--primary-green);
            color: white;
        }
        .page-btn:hover {
            background: var(--primary-green);
            color: white;
        }
        @media (max-width: 768px) {
            .news-card { grid-template-columns: 1fr; }
            .news-image { height: 200px; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">
                <span class="logo-icon" id="logo-icon">芝</span>
                <span id="logo-text">古芝源</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html" style="color: var(--gold);">新闻动态</a></li>
                <li class="dropdown">
                    <a href="special.html" onclick="event.preventDefault();event.stopPropagation();this.parentElement.toggleAttribute('data-open');">专题平台 ▾<span class="arrow">▼</span></a>
                    <ul class="dropdown-menu">
                        <li><a href="zhong-houlu.html">钟氏中医药第十八代传人钟厚禄传记</a></li>
                    </ul>
                </li>
                <li><a href="contact.html">联系方式</a></li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" id="cart-badge">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 新闻动态页面 -->
    <section class="news-page" id="news-content"></section>

    <!-- 页脚 -->
    <footer class="footer" id="footer"></footer>

    <script>
    (async function init() {
        try {
            const [newsRes, siteRes] = await Promise.all([
                fetch('content/news.json'),
                fetch('content/site.json')
            ]);
            const news = await newsRes.json();
            const site = await siteRes.json();
            const co = site.company || {};
            const ft = site.footer || {};

            // === Logo ===
            if (co.logoImage) {
                var li = document.getElementById('logo-img');
                if (li) { li.src = co.logoImage; li.style.display = ''; li.onerror = function() { li.style.display = 'none'; var lc2 = document.getElementById('logo-icon'); if (lc2) lc2.style.display = ''; }; }
                var lc = document.getElementById('logo-icon');
                if (lc) lc.style.display = 'none';
            }
            document.getElementById('logo-text').textContent = co.shortName || '古芝源';
            document.title = (news.title || '新闻动态') + ' - ' + (co.name || '贵州古芝源品牌管理有限公司');

            // === 新闻列表 ===
            const items = news.items || [];
            const pageSize = 6;
            let currentPage = 1;
            const totalPages = Math.ceil(items.length / pageSize);

            function formatDate(dateStr) {
                if (!dateStr) return '';
                var parts = dateStr.split('-');
                return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
            }

            function renderPage(page) {
                currentPage = page;
                var start = (page - 1) * pageSize;
                var end = Math.min(start + pageSize, items.length);
                var pageItems = items.slice(start, end);

                var html = '<h2 class="section-title fade-in">' + (news.title || '新闻动态') + '</h2>';
                html += '<p class="section-subtitle fade-in">' + (news.subtitle || '了解古芝源最新资讯') + '</p>';
                html += '<div class="news-list">';
                pageItems.forEach(function(item, idx) {
                    var dateStr = formatDate(item.date);
                    html += '<div class="news-card fade-in" onclick="location.href=\'news-detail.html\'">';
                    html += '<div class="news-image">' + (item.icon || '📰') + '</div>';
                    html += '<div class="news-content">';
                    if (dateStr) html += '<div class="news-date">' + dateStr + '</div>';
                    if (item.category) html += '<span class="news-category">' + item.category + '</span>';
                    html += '<h3>' + item.title + '</h3>';
                    html += '<p>' + (item.summary || '') + '</p>';
                    html += '<span class="news-link">阅读全文 →</span>';
                    html += '</div></div>';
                });
                html += '</div>';

                // 分页
                if (totalPages > 1) {
                    html += '<div class="pagination fade-in">';
                    for (var i = 1; i <= totalPages; i++) {
                        html += '<button class="page-btn' + (i === page ? ' active' : '') +
                            '" onclick="renderPage(' + i + ')">' + i + '</button>';
                    }
                    html += '</div>';
                }

                document.getElementById('news-content').innerHTML = html;

                // 重新初始化动画
                var fadeIns = document.querySelectorAll('.fade-in');
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
                }, { threshold: 0.1 });
                fadeIns.forEach(function(el) { observer.observe(el); });
            }

            // 暴露到全局
            window.renderPage = renderPage;
            renderPage(1);

            // === 页脚 ===
            document.getElementById('footer').innerHTML =
                '<p>' + (ft.copyright || '© 2026 贵州古芝源品牌管理有限公司 版权所有') + '</p>' +
                '<p>' + (ft.slogan || '传承古法 · 芝养人生') + '</p>';

        } catch (e) {
            console.error('Failed to load news page:', e);
        }
        updateCartBadge();
    })();
    </script>
    <script src="cart.js?v=20260618d"></script>
    <script src="nav.js"></script>
</body>
</html>
