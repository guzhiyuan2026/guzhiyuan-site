<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 贵州古芝源品牌管理有限公司</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .order-page {
            padding: 120px 2rem 5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .order-title {
            color: var(--primary-green);
            font-size: 2.2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .order-empty {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .order-empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .order-empty h3 {
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .order-empty p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .order-empty a {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .order-empty a:hover {
            background: var(--light-green);
        }

        .order-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }

        .order-card:hover {
            box-shadow: 0 5px 25px rgba(45, 80, 22, 0.12);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            background: var(--cream);
            border-bottom: 1px solid #ebe5d8;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .order-id {
            font-family: monospace;
            font-weight: bold;
            color: var(--primary-green);
            font-size: 1rem;
        }

        .order-time {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .order-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-paid {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-pending {
            background: #fff3e0;
            color: #e65100;
        }

        .status-confirmed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-shipped {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-completed {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .order-body {
            padding: 1.5rem;
        }

        .order-items {
            margin-bottom: 1rem;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f5f0e8;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .order-item-name {
            flex: 1;
            font-weight: 500;
            color: var(--text-dark);
        }

        .order-item-spec {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .order-item-price {
            color: var(--earth-brown);
            font-weight: bold;
            white-space: nowrap;
        }

        .order-item-qty {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-left: 0.3rem;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: #fafaf7;
            border-top: 1px solid #ebe5d8;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .order-total {
            font-size: 1.1rem;
            color: var(--earth-brown);
            font-weight: bold;
        }

        .order-total-amount {
            font-size: 1.3rem;
        }

        .order-customer {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .order-actions-bar {
            display: flex;
            justify-content: center;
            padding: 1rem;
        }

        .order-actions-bar a,
        .order-actions-bar button {
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-again {
            background: white;
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            text-decoration: none;
        }

        .btn-again:hover {
            background: var(--primary-green);
            color: white;
        }

        .btn-clear-history {
            background: none;
            color: #999;
            border: none;
            text-decoration: underline;
            cursor: pointer;
        }

        .btn-clear-history:hover {
            color: #d32f2f;
        }

        @media (max-width: 768px) {
            .order-page {
                padding: 100px 1rem 3rem;
            }

            .order-title {
                font-size: 1.8rem;
            }

            .order-header {
                padding: 1rem;
            }

            .order-body {
                padding: 1rem;
            }

            .order-footer {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">芝</span>
                古芝源
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li class="dropdown">
                    <a href="special.html" onclick="event.preventDefault();event.stopPropagation();this.parentElement.toggleAttribute('data-open');">专题平台 ▾<span class="arrow">▼</span></a>
                    <ul class="dropdown-menu">
                        <li><a href="zhong-houlu.html">钟氏中医药第十八代传人钟厚禄传记</a></li>
                    </ul>
                </li>
                <li><a href="contact.html">联系方式</a></li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" id="cart-badge">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <section class="order-page">
        <h2 class="order-title fade-in">我的订单</h2>

        <div id="order-empty" class="order-empty fade-in" style="display:none;">
            <div class="order-empty-icon">📋</div>
            <h3>暂无订单记录</h3>
            <p>您还没有提交过订单，快去选购商品吧！</p>
            <a href="products.html">去逛逛</a>
        </div>

        <div id="order-list" class="order-list fade-in"></div>

        <div id="order-actions-bar" class="order-actions-bar" style="display:none;">
            <button class="btn-clear-history" onclick="clearOrderHistory()">清空订单记录</button>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <p>© 2026 贵州古芝源品牌管理有限公司 版权所有</p>
        <p>传承古法 · 芝养人生</p>
    </footer>

    <script src="cart.js?v=20260624"></script>
    <script src="nav.js"></script>
    <script>
        // 渲染订单列表
        function renderOrders() {
            var orders = getOrderHistory();
            var emptyEl = document.getElementById('order-empty');
            var listEl = document.getElementById('order-list');
            var actionsBar = document.getElementById('order-actions-bar');

            if (orders.length === 0) {
                emptyEl.style.display = '';
                listEl.innerHTML = '';
                actionsBar.style.display = 'none';
                return;
            }

            emptyEl.style.display = 'none';
            actionsBar.style.display = '';

            var statusMap = {
                'pending': '待支付',
                'paid': '已支付',
                'confirmed': '已确认',
                'shipped': '已发货',
                'completed': '已完成',
                'cancelled': '已取消'
            };

            listEl.innerHTML = orders.map(function(order) {
                var itemsHtml = order.items.map(function(item) {
                    return '<div class="order-item">' +
                        '<div class="order-item-icon">' + (item.icon || '📦') + '</div>' +
                        '<div class="order-item-name">' +
                            item.name +
                            (item.spec ? '<div class="order-item-spec">' + item.spec + '</div>' : '') +
                        '</div>' +
                        '<div class="order-item-price">' + item.price + '<span class="order-item-qty">×' + item.quantity + '</span></div>' +
                    '</div>';
                }).join('');

                // 支付方式显示
                var payInfo = '';
                if (order.status === 'paid' && order.payTimeDisplay) {
                    payInfo = '<div style="font-size:0.8rem;color:var(--text-light);margin-top:0.25rem;">✓ 已支付 · ' + order.payTimeDisplay + '</div>';
                } else if (order.status === 'pending') {
                    payInfo = '<div style="font-size:0.8rem;color:#e65100;margin-top:0.25rem;">⏳ 等待支付</div>';
                }

                return '<div class="order-card">' +
                    '<div class="order-header">' +
                        '<span class="order-id">订单 ' + order.id + '</span>' +
                        '<span class="order-time">' + (order.orderTimeDisplay || '') + '</span>' +
                        '<span class="order-status status-' + (order.status || 'pending') + '">' + (statusMap[order.status] || '待支付') + '</span>' +
                    '</div>' +
                    '<div class="order-body">' +
                        '<div class="order-items">' + itemsHtml + '</div>' +
                        payInfo +
                    '</div>' +
                    '<div class="order-footer">' +
                        '<span class="order-customer">' + order.customerName + ' | ' + order.customerPhone + (order.customerAddress ? ' | ' + order.customerAddress : '') + '</span>' +
                        '<span class="order-total">合计 <span class="order-total-amount">¥ ' + order.total.toFixed(2) + '</span></span>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        // 清空订单记录
        function clearOrderHistory() {
            showConfirm('清空订单记录', '确定要删除所有订单记录吗？此操作不可恢复。', function() {
                localStorage.removeItem('guzhiyuan_orders');
                renderOrders();
                showNotification('订单记录已清空', 'info');
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 确保 .fade-in 元素始终可见
            var fadeIns = document.querySelectorAll('.fade-in');
            fadeIns.forEach(function(el) {
                el.style.opacity = '1';
                el.style.transform = 'none';
            });

            renderOrders();
            updateCartBadge();
        });
    </script>
</body>
</html>
