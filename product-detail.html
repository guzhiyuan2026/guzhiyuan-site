<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品详情 - 贵州古芝源品牌管理有限公司</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-detail-page {
            padding: 120px 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .breadcrumb {
            margin-bottom: 2rem;
            color: var(--text-light);
        }

        .breadcrumb a {
            color: var(--primary-green);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 4rem;
        }

        .product-gallery {
            position: sticky;
            top: 120px;
        }

        .main-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            color: white;
            margin-bottom: 1rem;
        }

        .thumbnail-list {
            display: flex;
            gap: 1rem;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            background: var(--cream);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .thumbnail.active {
            border-color: var(--primary-green);
        }

        .product-info-section h1 {
            color: var(--primary-green);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .product-subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .product-price-section {
            background: var(--cream);
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .price {
            font-size: 2rem;
            color: var(--earth-brown);
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .quantity-selector label {
            color: var(--text-dark);
            font-weight: 500;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--primary-green);
            background: white;
            color: var(--primary-green);
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .quantity-btn:hover {
            background: var(--primary-green);
            color: white;
        }

        .quantity-input {
            width: 60px;
            height: 36px;
            border: 2px solid var(--cream);
            border-radius: 5px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        .product-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-add-cart {
            flex: 1;
            padding: 1rem;
            background: white;
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-add-cart:hover {
            background: var(--primary-green);
            color: white;
        }

        .btn-buy-now {
            flex: 1;
            padding: 1rem;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-buy-now:hover {
            background: var(--light-green);
        }

        .product-attributes {
            margin-bottom: 2rem;
        }

        .attribute-item {
            display: flex;
            padding: 1rem 0;
            border-bottom: 1px solid var(--cream);
        }

        .attribute-label {
            width: 100px;
            color: var(--text-light);
            flex-shrink: 0;
        }

        .attribute-value {
            color: var(--text-dark);
            font-weight: 500;
        }

        .product-description {
            margin-top: 3rem;
        }

        .section-heading {
            color: var(--primary-green);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--cream);
        }

        .product-description p {
            line-height: 2;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .product-features {
            margin-top: 3rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .feature-item {
            text-align: center;
            padding: 2rem;
            background: var(--cream);
            border-radius: 10px;
        }

        .feature-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .feature-item h4 {
            color: var(--primary-green);
            margin-bottom: 0.5rem;
        }

        .feature-item p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .usage-section {
            margin-top: 3rem;
        }

        .usage-steps {
            margin-top: 2rem;
        }

        .usage-step {
            display: flex;
            margin-bottom: 2rem;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .step-number {
            width: 50px;
            height: 50px;
            background: var(--primary-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            flex-shrink: 0;
            margin-right: 2rem;
        }

        .step-content h4 {
            color: var(--primary-green);
            margin-bottom: 0.5rem;
        }

        .step-content p {
            color: var(--text-light);
            line-height: 1.8;
        }

        .related-products {
            margin-top: 4rem;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .related-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .related-card:hover {
            transform: translateY(-5px);
        }

        .related-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }

        .related-info {
            padding: 1.5rem;
        }

        .related-info h4 {
            color: var(--primary-green);
            margin-bottom: 0.5rem;
        }

        .related-info p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
            }

            .product-gallery {
                position: static;
            }

            .product-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">芝</span>
                古芝源
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li><a href="contact.html">联系方式</a></li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" id="cart-badge">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 产品详情页面 -->
    <section class="product-detail-page">
        <div class="breadcrumb fade-in">
            <a href="index.html">首页</a> > <a href="products.html">产品中心</a> > <span id="breadcrumb-product-name">产品详情</span>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="loading fade-in">
            正在加载产品信息...
        </div>

        <!-- 产品详情容器 -->
        <div id="product-detail-container" class="product-detail-container" style="display: none;">
            <!-- 产品图片 -->
            <div class="product-gallery fade-in">
                <div class="main-image" id="mainImage">🌿</div>
                <div class="thumbnail-list">
                    <div class="thumbnail active" onclick="changeImage('🌿', this)">🌿</div>
                    <div class="thumbnail" onclick="changeImage('📦', this)">📦</div>
                    <div class="thumbnail" onclick="changeImage('🏭', this)">🏭</div>
                    <div class="thumbnail" onclick="changeImage('✅', this)">✅</div>
                </div>
            </div>

            <!-- 产品信息 -->
            <div class="product-info-section fade-in">
                <h1 id="product-name">产品名称</h1>
                <p class="product-subtitle" id="product-subtitle">产品副标题</p>

                <div class="product-price-section">
                    <div class="price" id="product-price">¥ 0.00</div>

                    <!-- 数量选择 -->
                    <div class="quantity-selector">
                        <label>数量：</label>
                        <div class="quantity-controls">
                            <button class="quantity-btn" onclick="changeQuantity(-1)">-</button>
                            <input type="number" class="quantity-input" id="quantity" value="1" min="1" max="99">
                            <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
                        </div>
                    </div>

                    <div class="product-actions">
                        <button class="btn-add-cart" onclick="handleAddToCart()">
                            <span>🛒</span>
                            加入购物车
                        </button>
                        <button class="btn-buy-now" onclick="handleBuyNow()">
                            <span>💳</span>
                            立即购买
                        </button>
                    </div>
                </div>

                <div class="product-attributes">
                    <div class="attribute-item">
                        <span class="attribute-label">产品名称</span>
                        <span class="attribute-value" id="attr-name">-</span>
                    </div>
                    <div class="attribute-item">
                        <span class="attribute-label">规格</span>
                        <span class="attribute-value" id="attr-spec">-</span>
                    </div>
                    <div class="attribute-item">
                        <span class="attribute-label">产地</span>
                        <span class="attribute-value" id="attr-origin">-</span>
                    </div>
                    <div class="attribute-item">
                        <span class="attribute-label">保质期</span>
                        <span class="attribute-value" id="attr-shelf-life">-</span>
                    </div>
                    <div class="attribute-item">
                        <span class="attribute-label">储藏方法</span>
                        <span class="attribute-value" id="attr-storage">-</span>
                    </div>
                    <div class="attribute-item">
                        <span class="attribute-label">执行标准</span>
                        <span class="attribute-value" id="attr-standard">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 产品介绍 -->
        <div id="product-description" class="product-description fade-in" style="display: none;">
            <h2 class="section-heading">产品介绍</h2>
            <div id="product-body"></div>
        </div>

        <!-- 产品特点 -->
        <div id="product-features" class="product-features fade-in" style="display: none;">
            <h2 class="section-heading">产品特点</h2>
            <div class="features-grid" id="features-grid"></div>
        </div>

        <!-- 使用方法 -->
        <div id="product-usage" class="usage-section fade-in" style="display: none;">
            <h2 class="section-heading">使用方法</h2>
            <div class="usage-steps" id="usage-steps"></div>
        </div>

        <!-- 相关产品 -->
        <div id="related-products" class="related-products fade-in" style="display: none;">
            <h2 class="section-heading">相关产品</h2>
            <div class="related-grid" id="related-grid"></div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" id="footer">
        <p>© 2026 贵州古芝源品牌管理有限公司 版权所有</p>
        <p>传承古法 · 芝养人生</p>
    </footer>

    <script src="cart.js?v=20260618d"></script>
    <script>
        let currentProduct = null;
        let currentQuantity = 1;

        // 获取 URL 参数
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 切换图片
        function changeImage(emoji, element) {
            document.getElementById('mainImage').textContent = emoji;
            document.querySelectorAll('.thumbnail').forEach(thumb => {
                thumb.classList.remove('active');
            });
            element.classList.add('active');
        }

        // 修改数量
        function changeQuantity(delta) {
            const input = document.getElementById('quantity');
            let value = parseInt(input.value) || 1;
            value += delta;
            if (value < 1) value = 1;
            if (value > 99) value = 99;
            input.value = value;
            currentQuantity = value;
        }

        // 监听数量输入
        document.addEventListener('DOMContentLoaded', function() {
            const quantityInput = document.getElementById('quantity');
            if (quantityInput) {
                quantityInput.addEventListener('change', function() {
                    let value = parseInt(this.value) || 1;
                    if (value < 1) value = 1;
                    if (value > 99) value = 99;
                    this.value = value;
                    currentQuantity = value;
                });
            }
        });

        // 加入购物车
        function handleAddToCart() {
            if (!currentProduct) return;

            const productToAdd = {
                id: currentProduct.id,
                name: currentProduct.name,
                icon: currentProduct.icon,
                price: currentProduct.price,
                unit: currentProduct.unit || '件',
                spec: currentProduct.spec || ''
            };

            // 添加指定数量
            for (let i = 0; i < currentQuantity; i++) {
                addToCart(productToAdd);
            }

            showAddToCartToast(currentProduct.name);
        }

        // 立即购买
        function handleBuyNow() {
            if (!currentProduct) return;

            // 添加到购物车
            const productToAdd = {
                id: currentProduct.id,
                name: currentProduct.name,
                icon: currentProduct.icon,
                price: currentProduct.price,
                unit: currentProduct.unit || '件',
                spec: currentProduct.spec || ''
            };

            for (let i = 0; i < currentQuantity; i++) {
                addToCart(productToAdd);
            }

            // 跳转到购物车页面
            window.location.href = 'cart.html';
        }

        // 加载产品数据
        async function loadProductData() {
            const productId = getQueryParam('id');

            if (!productId) {
                document.getElementById('loading').textContent = '产品ID缺失，正在返回产品列表...';
                setTimeout(() => {
                    window.location.href = 'products.html';
                }, 2000);
                return;
            }

            try {
                const response = await fetch('content/products.json');
                const data = await response.json();

                // 查找产品
                currentProduct = data.items.find(item => item.id === productId);

                if (!currentProduct) {
                    document.getElementById('loading').textContent = '产品未找到，正在返回产品列表...';
                    setTimeout(() => {
                        window.location.href = 'products.html';
                    }, 2000);
                    return;
                }

                // 更新页面标题
                document.title = currentProduct.name + ' - 贵州古芝源品牌管理有限公司';

                // 更新面包屑
                document.getElementById('breadcrumb-product-name').textContent = currentProduct.name;

                // 更新产品基本信息
                document.getElementById('product-name').textContent = currentProduct.name;
                document.getElementById('product-subtitle').textContent = currentProduct.tags ? currentProduct.tags.join(' · ') : '';
                document.getElementById('product-price').textContent = currentProduct.price + (currentProduct.unit ? ' / ' + currentProduct.unit : '');

                // 更新产品属性
                document.getElementById('attr-name').textContent = currentProduct.name;
                document.getElementById('attr-spec').textContent = currentProduct.spec || '-';
                document.getElementById('attr-origin').textContent = currentProduct.origin || '-';
                document.getElementById('attr-shelf-life').textContent = currentProduct.shelfLife || '-';
                document.getElementById('attr-storage').textContent = currentProduct.storage || '-';
                document.getElementById('attr-standard').textContent = currentProduct.standard || '-';

                // 更新产品介绍
                if (currentProduct.body) {
                    const bodyHtml = currentProduct.body.split('\n').map(p => `<p>${p}</p>`).join('');
                    document.getElementById('product-body').innerHTML = bodyHtml;
                    document.getElementById('product-description').style.display = '';
                }

                // 更新产品特点
                if (currentProduct.features && currentProduct.features.length > 0) {
                    const featuresGrid = document.getElementById('features-grid');
                    featuresGrid.innerHTML = currentProduct.features.map(f => `
                        <div class="feature-item">
                            <span class="feature-icon">${f.icon}</span>
                            <h4>${f.title}</h4>
                            <p>${f.desc}</p>
                        </div>
                    `).join('');
                    document.getElementById('product-features').style.display = '';
                }

                // 更新使用方法
                if (currentProduct.usage && currentProduct.usage.length > 0) {
                    const usageSteps = document.getElementById('usage-steps');
                    usageSteps.innerHTML = currentProduct.usage.map(u => `
                        <div class="usage-step">
                            <div class="step-number">${u.step}</div>
                            <div class="step-content">
                                <h4>${u.title}</h4>
                                <p>${u.desc}</p>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('product-usage').style.display = '';
                }

                // 更新相关产品
                const relatedProducts = data.items
                    .filter(item => item.id !== currentProduct.id && item.category === currentProduct.category)
                    .slice(0, 3);
                if (relatedProducts.length > 0) {
                    const relatedGrid = document.getElementById('related-grid');
                    relatedGrid.innerHTML = relatedProducts.map(p => `
                        <div class="related-card" onclick="location.href='product-detail.html?id=${p.id}'">
                            <div class="related-image">${p.icon}</div>
                            <div class="related-info">
                                <h4>${p.name}</h4>
                                <p>${p.description}</p>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('related-products').style.display = '';
                }

                // 隐藏加载状态，显示产品详情
                document.getElementById('loading').style.display = 'none';
                document.getElementById('product-detail-container').style.display = '';

                // 更新购物车角标
                updateCartBadge();

            } catch (error) {
                console.error('加载产品数据失败:', error);
                document.getElementById('loading').textContent = '加载失败，请刷新页面重试。';
            }
        }

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // 滚动动画
        const fadeInElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1
        });

        fadeInElements.forEach(element => {
            observer.observe(element);
        });

        // 页面加载时执行
        loadProductData();
    </script>
    <script src="nav.js"></script>
</body>
</html>
