<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品中心 - 贵州古芝源品牌管理有限公司</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .products-page {
            padding: 120px 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.15);
        }
        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }
        .product-info { padding: 2rem; }
        .product-info h3 {
            color: var(--primary-green);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .product-info p {
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tag {
            background: var(--cream);
            color: var(--primary-green);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .product-price {
            color: var(--earth-brown);
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .product-button {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            width: 100%;
            text-align: center;
        }
        .product-button:hover { background: var(--light-green); }
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 3rem 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.8rem 2rem;
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .filter-btn.active {
            background: var(--primary-green);
            color: white;
        }
        .filter-btn:hover {
            background: var(--primary-green);
            color: white;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">
                <span class="logo-icon" id="logo-icon">芝</span>
                <span id="logo-text">古芝源</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html" style="color: var(--gold);">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li><a href="contact.html">联系方式</a></li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" id="cart-badge">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 产品中心页面 -->
    <section class="products-page" id="products-content"></section>

    <!-- 页脚 -->
    <footer class="footer" id="footer"></footer>

    <script>
    (async function init() {
        try {
            const [prodRes, siteRes] = await Promise.all([
                fetch('content/products.json'),
                fetch('content/site.json')
            ]);
            const products = await prodRes.json();
            const site = await siteRes.json();
            const co = site.company || {};
            const ft = site.footer || {};

            // === Logo ===
            if (co.logoImage) {
                var li = document.getElementById('logo-img');
                if (li) { li.src = co.logoImage; li.style.display = ''; li.onerror = function() { li.style.display = 'none'; var lc2 = document.getElementById('logo-icon'); if (lc2) lc2.style.display = ''; }; }
                var lc = document.getElementById('logo-icon');
                if (lc) lc.style.display = 'none';
            }
            document.getElementById('logo-text').textContent = co.shortName || '古芝源';
            document.title = (products.title || '产品中心') + ' - ' + (co.name || '贵州古芝源品牌管理有限公司');

            var items = products.items || [];

            // === 收集所有分类 ===
            var categories = ['all'];
            var catNames = { all: '全部产品' };
            items.forEach(function(p) {
                if (p.category && !catNames[p.category]) {
                    catNames[p.category] = { herbs: '道地药材', tea: '养生茶饮', formula: '汉方制剂', gift: '健康礼品', healthcare: '健康产品' }[p.category] || p.category;
                    categories.push(p.category);
                }
            });

            // === 渲染函数 ===
            function renderPage(activeCat) {
                var html = '<h2 class="section-title fade-in">' + (products.title || '产品中心') + '</h2>';
                html += '<p class="section-subtitle fade-in">' + (products.subtitle || '道地药材 · 古法炮制 · 品质保证') + '</p>';

                // 分类筛选按钮
                html += '<div class="category-filter fade-in">';
                categories.forEach(function(cat) {
                    html += '<button class="filter-btn' + (cat === activeCat ? ' active' : '') +
                        '" data-category="' + cat + '" onclick="window.productFilter(\'' + cat + '\')">' + (catNames[cat] || cat) + '</button>';
                });
                html += '</div>';

                // 产品网格
                html += '<div class="products-grid" id="products-grid">';
                items.forEach(function(p) {
                    var display = (activeCat === 'all' || p.category === activeCat) ? '' : 'display:none;';
                    html += '<div class="product-card fade-in" data-category="' + (p.category || '') + '" style="' + display + '" onclick="location.href=\'product-detail.html?id=' + (p.id || '') + '\'">';
                    html += '<div class="product-image">' + (p.icon || '🌿') + '</div>';
                    html += '<div class="product-info">';
                    html += '<h3>' + p.name + '</h3>';
                    if (p.tags && p.tags.length > 0) {
                        html += '<div class="product-tags">';
                        p.tags.forEach(function(t) { html += '<span class="tag">' + t + '</span>'; });
                        html += '</div>';
                    }
                    html += '<p>' + (p.description || '') + '</p>';
                    html += '<div class="product-price">' + (p.price || '') + ' / ' + (p.unit || '') + '</div>';
                    html += '<span class="product-button">查看详情</span>';
                    html += '</div></div>';
                });
                html += '</div>';

                document.getElementById('products-content').innerHTML = html;

                // 重新初始化动画
                var fadeIns = document.querySelectorAll('.fade-in');
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
                }, { threshold: 0.1 });
                fadeIns.forEach(function(el) { observer.observe(el); });
            }

            // === 筛选切换 ===
            window.productFilter = function(cat) {
                var btns = document.querySelectorAll('.filter-btn');
                btns.forEach(function(b) { b.classList.remove('active'); });
                var activeBtn = document.querySelector('.filter-btn[data-category="' + cat + '"]');
                if (activeBtn) activeBtn.classList.add('active');

                var cards = document.querySelectorAll('.product-card');
                cards.forEach(function(card) {
                    if (cat === 'all' || card.getAttribute('data-category') === cat) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            };

            renderPage('all');

            // === 页脚 ===
            document.getElementById('footer').innerHTML =
                '<p>' + (ft.copyright || '© 2026 贵州古芝源品牌管理有限公司 版权所有') + '</p>' +
                '<p>' + (ft.slogan || '传承古法 · 芝养人生') + '</p>';

        } catch (e) {
            console.error('Failed to load products page:', e);
        }
        updateCartBadge();
    })();
    </script>
    <script src="cart.js"></script>
</body>
</html>
