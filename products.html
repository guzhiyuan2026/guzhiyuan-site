<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品中心 - 古芝源</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .products-page { padding: 120px 2rem 5rem; max-width: 1200px; margin: 0 auto; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.15);
        }
        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }
        .product-info { padding: 2rem; }
        .product-info h3 { color: var(--primary-green); font-size: 1.5rem; margin-bottom: 1rem; }
        .product-info p { color: var(--text-light); line-height: 1.8; margin-bottom: 1rem; }
        .product-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .tag {
            background: var(--cream);
            color: var(--primary-green);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .product-price { color: var(--earth-brown); font-size: 1.3rem; font-weight: bold; margin-bottom: 1rem; }
        .product-button {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            width: 100%;
            text-align: center;
        }
        .product-button:hover { background: var(--light-green); }
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 3rem 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.8rem 2rem;
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .filter-btn.active { background: var(--primary-green); color: white; }
        .filter-btn:hover { background: var(--primary-green); color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img class="logo-img" id="logo-img" src="" alt="" style="display:none;">
                <span class="logo-icon" id="logo-icon">芝</span>
                古芝源
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="products.html" style="color: var(--gold);">产品中心</a></li>
                <li><a href="news.html">新闻动态</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>

    <section class="products-page">
        <h2 class="section-title fade-in" id="products-title">产品中心</h2>
        <p class="section-subtitle fade-in" id="products-subtitle"></p>
        <div class="category-filter fade-in" id="category-filter"></div>
        <div class="products-grid" id="products-grid"></div>
    </section>

    <footer class="footer">
        <p>© 2026 贵州古芝源品牌管理有限公司 版权所有</p>
        <p>传承古法 · 芝养人生</p>
    </footer>

    <script>
        let allProducts = [];
        let currentFilter = 'all';

        async function init() {
            try {
                const resp = await fetch('content/products.json');
                const data = await resp.json();
                document.getElementById('products-title').textContent = data.title;
                document.getElementById('products-subtitle').textContent = data.subtitle;

                // 分类筛选按钮
                document.getElementById('category-filter').innerHTML = data.categories.map(c =>
                    '<button class="filter-btn' + (c.id === 'all' ? ' active' : '') + '" data-category="' + c.id + '">' + c.name + '</button>'
                ).join('');

                allProducts = data.items;
                renderProducts('all');

                // 筛选事件
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        renderProducts(this.dataset.category);
                    });
                });
            } catch (err) {
                console.error('产品数据加载失败:', err);
            }
            initAnimations();
        }

        function renderProducts(category) {
            currentFilter = category;
            const items = category === 'all' ? allProducts : allProducts.filter(p => p.category === category);
            document.getElementById('products-grid').innerHTML = items.map(p =>
                '<div class="product-card fade-in" data-category="' + p.category + '" onclick="location.href=\'product-detail.html\'">' +
                '<div class="product-image">' + p.icon + '</div>' +
                '<div class="product-info">' +
                '<h3>' + p.name + '</h3>' +
                '<div class="product-tags">' + p.tags.map(t => '<span class="tag">' + t + '</span>').join('') + '</div>' +
                '<p>' + p.description + '</p>' +
                '<div class="product-price">' + p.price + '</div>' +
                '<span class="product-button">查看详情</span>' +
                '</div></div>'
            ).join('');
            initAnimations();
        }

        function initAnimations() {
            const els = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            els.forEach(el => observer.observe(el));
        }

        init();
    </script>
    <script>
    (async function(){
        try{
            const r=await fetch('content/site.json');
            const s=await r.json();
            if(s.company&&s.company.logoImage){
                var i=document.getElementById('logo-img');
                if(i){i.src=s.company.logoImage;i.style.display='';}
                var c=document.getElementById('logo-icon');
                if(c)c.style.display='none';
            }
        }catch(e){}
    })();
    </script>
</body>
</html>
