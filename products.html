<link rel="stylesheet" href="styles.css">
    <style>
        .products-page {
            padding: 120px 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.15);
        }
        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            overflow: hidden;
        }
        .product-image img.product-image-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 分类色带：直观区分产品系列 */
        .product-card .cat-band {
            height: 4px;
            width: 100%;
        }
        .product-meta {
            color: #8a8a8a;
            font-size: 0.88rem;
            margin-bottom: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .product-meta span { white-space: nowrap; }
        .disclaimer {
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: #7a7a7a;
            line-height: 1.9;
            padding: 1rem 1.3rem;
            border-left: 3px solid var(--gold, #c9a227);
            background: var(--cream, #faf6ee);
            border-radius: 4px;
        }
        .product-info { padding: 2rem; }
        .product-info h3 {
            color: var(--primary-green);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .product-info p {
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tag {
            background: var(--cream);
            color: var(--primary-green);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .product-price {
            color: var(--earth-brown);
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .product-button {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            width: 100%;
            text-align: center;
        }
        .product-button:hover { background: var(--light-green); }
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 3rem 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.8rem 2rem;
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .filter-btn.active {
            background: var(--primary-green);
            color: white;
        }
        .filter-btn:hover {
            background: var(--primary-green);
            color: white;
        }
    </style>

    <script src="cart.js?v=20260624"></script>
    <script>
    (async function init() {
        try {
            const [prodRes, siteRes] = await Promise.all([
                fetch('content/products.json'),
                fetch('content/site.json')
            ]);
            const products = await prodRes.json();
            const site = await siteRes.json();
            const co = site.company || {};
            const ft = site.footer || {};

            // === Logo ===
            if (co.logoImage) {
                var li = document.getElementById('logo-img');
                if (li) { li.src = co.logoImage; li.style.display = ''; li.onerror = function() { li.style.display = 'none'; var lc2 = document.getElementById('logo-icon'); if (lc2) lc2.style.display = ''; }; }
                var lc = document.getElementById('logo-icon');
                if (lc) lc.style.display = 'none';
            }
            document.getElementById('logo-text').textContent = co.shortName || '古芝源';
            document.title = (products.title || '产品中心') + ' - ' + (co.name || '贵州古芝源品牌管理有限公司');

            var items = products.items || [];

            // === 收集所有分类 ===
            var categories = ['all'];
            var catNames = { all: '全部产品' };
            // 分类中文名
            var CAT_LABEL = { herbs: '道地药材', tea: '养生茶饮', formula: '汉方制剂', gift: '健康礼品', healthcare: '健康产品', wine: '养生酒' };
            // 分类主题色（用于图片区渐变与顶部色带）
            var CAT_COLOR = {
                herbs:   ['#2d5016', '#6b9b3a'],
                formula: ['#8b6f2a', '#d4a94e'],
                wine:    ['#7a1f2b', '#b8443c'],
                tea:     ['#c9662a', '#e8a04f'],
                gift:    ['#8e2f3d', '#c96a4e']
            };
            var CAT_DEFAULT = ['#2d5016', '#6b9b3a'];
            items.forEach(function(p) {
                if (p.category && !catNames[p.category]) {
                    catNames[p.category] = CAT_LABEL[p.category] || p.category;
                    categories.push(p.category);
                }
            });

            // === 渲染函数 ===
            function renderPage(activeCat) {
                var html = '<h2 class="section-title fade-in">' + (products.title || '产品中心') + '</h2>';
                html += '<p class="section-subtitle fade-in">' + (products.subtitle || '道地药材 · 古法炮制 · 品质保证') + '</p>';

                // 分类筛选按钮
                html += '<div class="category-filter fade-in">';
                categories.forEach(function(cat) {
                    html += '<button class="filter-btn' + (cat === activeCat ? ' active' : '') +
                        '" data-category="' + cat + '" onclick="window.productFilter(\'' + cat + '\')">' + (catNames[cat] || cat) + '</button>';
                });
                html += '</div>';

                // 产品网格
                html += '<div class="products-grid" id="products-grid">';
                items.forEach(function(p) {
                    var display = (activeCat === 'all' || p.category === activeCat) ? '' : 'display:none;';
                    var colors = CAT_COLOR[p.category] || CAT_DEFAULT;
                    html += '<div class="product-card fade-in" data-category="' + (p.category || '') + '" style="' + display + '" onclick="location.href=\'product-detail.html?id=' + (p.id || '') + '\'">';
                    html += '<div class="cat-band" style="background:linear-gradient(90deg,' + colors[0] + ',' + colors[1] + ')"></div>';
                    // 有真实产品图则显示图片，否则显示 emoji 图标
                    if (p.image) {
                        html += '<div class="product-image" style="background:#fff">'
                            + '<img class="product-image-img" src="' + p.image + '" alt="' + (p.name || '产品图片') + '" loading="lazy">'
                            + '</div>';
                    } else {
                        html += '<div class="product-image" style="background:linear-gradient(135deg,' + colors[0] + ',' + colors[1] + ')">' + (p.icon || '🌿') + '</div>';
                    }
                    html += '<div class="product-info">';
                    html += '<h3>' + p.name + '</h3>';
                    if (p.tags && p.tags.length > 0) {
                        html += '<div class="product-tags">';
                        p.tags.forEach(function(t) { html += '<span class="tag">' + t + '</span>'; });
                        html += '</div>';
                    }
                    html += '<p>' + (p.description || '') + '</p>';
                    // 规格 / 产地 元信息
                    var metaBits = [];
                    if (p.spec) metaBits.push('规格：' + p.spec);
                    if (p.origin) metaBits.push('产地：' + p.origin);
                    if (metaBits.length > 0) {
                        html += '<div class="product-meta">';
                        metaBits.forEach(function(m) { html += '<span>' + m + '</span>'; });
                        html += '</div>';
                    }
                    // 价格：仅当以 ¥ 开头时才附带单位
                    var priceText = p.price || '';
                    if (priceText.indexOf('¥') === 0 && p.unit) priceText += ' / ' + p.unit;
                    html += '<div class="product-price">' + priceText + '</div>';
                    html += '<span class="product-button">查看详情</span>';
                    html += '</div></div>';
                });
                html += '</div>';

                // 免责声明（食品/食药同源类产品合规提示）
                html += '<p class="disclaimer">'
                    + '本页所载产品信息仅供参考。以上产品为食品及药食同源类产品，不能替代药品，不用于疾病的预防、治疗或诊断。'
                    + '孕妇、哺乳期妇女、儿童及正在服药或有基础疾病者，请在专业人士指导下使用；具体用法、用量与禁忌以产品包装说明为准。'
                    + '</p>';

                document.getElementById('products-content').innerHTML = html;

                // 重新初始化动画
                var fadeIns = document.querySelectorAll('.fade-in');
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
                }, { threshold: 0.1 });
                fadeIns.forEach(function(el) { observer.observe(el); });
            }

            // === 筛选切换 ===
            window.productFilter = function(cat) {
                var btns = document.querySelectorAll('.filter-btn');
                btns.forEach(function(b) { b.classList.remove('active'); });
                var activeBtn = document.querySelector('.filter-btn[data-category="' + cat + '"]');
                if (activeBtn) activeBtn.classList.add('active');

                var cards = document.querySelectorAll('.product-card');
                cards.forEach(function(card) {
                    if (cat === 'all' || card.getAttribute('data-category') === cat) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            };

            renderPage('all');

            // === 页脚 ===
            document.getElementById('footer').innerHTML =
                '<p>' + (ft.copyright || '© 2026 贵州古芝源品牌管理有限公司 版权所有') + '</p>' +
                '<p>' + (ft.slogan || '传承古法 · 芝养人生') + '</p>';

        } catch (e) {
            console.error('Failed to load products page:', e);
        }
        updateCartBadge();
    })();
    </script>
</body>
